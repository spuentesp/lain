name: 'Lain Architecture Health Badge'
description: 'Runs lain on the workspace and posts a markdown architecture-health summary as a sticky PR comment plus a pass/fail commit status.'

# Callers must grant statuses: write and pull-requests: write in their workflow.

inputs:
  github-token:
    description: 'Token for posting the status check and the sticky comment.'
    required: true
  min-fan-out:
    description: 'High-fan-out threshold passed to architectural_observations.'
    required: false
    default: '15'
  comment-header:
    description: 'Sticky-comment header key. Use the same value to update an existing comment instead of posting a new one.'
    required: false
    default: 'lain-health'
  lain-version:
    description: 'Lain release tag to install. The default must track the latest release; the version-drift job in ci.yml fails the build if it does not. Bump on every release.'
    required: false
    default: 'v0.6.2'
  reindex-timeout:
    description: 'Seconds to wait for the cold-start re-index. Lain defaults to 300s; the action bumps to 600s because the first run on a repo pays the full cost.'
    required: false
    default: '600'
  lsp-languages:
    description: 'Languages to install LSPs for before computing health. "auto" (default) detects from project files (Cargo.toml, pyproject.toml, go.mod, tsconfig.json, package.json, etc.). Pass a comma-separated list to force specific languages (e.g. "python,rust"). Pass "" to skip LSP installation entirely.'
    required: false
    default: 'auto'

runs:
  using: 'composite'
  steps:
    # Pinned by commit SHA. Resolve the current SHA at the v4 tag with:
    #   git ls-remote https://github.com/actions/cache.git refs/tags/v4
    # Dependabot (see .github/dependabot.yml) keeps this current.
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Restore lain index cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        # Key includes a hash of the action's source so that any
        # change to the action (e.g. adding LSP support, fixing a
        # bug in health.sh) invalidates the index. Without this,
        # a stale index from a previous run with the old action
        # would be restored and the new behavior wouldn't take
        # effect until the workspace source changed.
        path: .lain
        key: lain-index-${{ github.sha }}-${{ hashFiles('.github/actions/lain-health-badge/**') }}
        restore-keys: |
          lain-index-main-

    - name: Install lain
      shell: bash
      env:
        LAIN_VERSION: ${{ inputs.lain-version }}
      run: bash "${{ github.action_path }}/install-binary.sh"

    - name: Compute architecture health
      id: health
      shell: bash
      env:
        LAIN_REINDEX_TIMEOUT: ${{ inputs.reindex-timeout }}
        INPUT_MIN_FAN_OUT: ${{ inputs.min-fan-out }}
        INPUT_LSP_LANGUAGES: ${{ inputs.lsp-languages }}
        # GITHUB_TOKEN is the GitHub-issued token for this run; we
        # use it for the per-PR Pulls API call to enumerate the
        # files changed in the PR. Without it, the per-PR section
        # is skipped (no GITHUB_TOKEN → no API call).
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: bash "${{ github.action_path }}/health.sh"

    - name: Post commit status
      if: always()
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const level = '${{ steps.health.outputs.level }}' || 'error';
          const summary = ('${{ steps.health.outputs.summary }}' || 'lain-health-badge failed').slice(0, 140);
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: level,
            description: summary,
            context: 'lain/health-badge'
          });

    - name: Post sticky PR comment
      if: github.event_name == 'pull_request' && steps.health.outputs.body != ''
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
      with:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        header: ${{ inputs.comment-header }}
        message: ${{ steps.health.outputs.body }}

branding:
  icon: 'shield'
  color: 'blue'

