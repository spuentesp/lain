name: Distribution acceptance

# Milestone 9 (docs/AGENT_UX_ROADMAP.md): "The real acceptance test is not
# 'Cargo tests pass.' It is 'a stranger can install LAIN in a clean
# environment and an MCP client can talk to it.'"
#
# This tests *published* state -- the npm registry and GitHub Releases --
# not this workflow run's own checkout. A PR's code diff has no bearing on
# what's already published, so this never runs on push/pull_request; it
# runs on a schedule, on demand, and right after a Release run completes
# (the roadmap's "release cannot be considered distribution-green unless
# the clean-room path passes" gate).
#
# Three lanes, all driving scripts/clean_room_mcp_check.py through the
# same protocol sequence (initialize -> tools/list -> get_capabilities,
# polling warming_up at the envelope's own retry_after_ms -> one
# structural query) so a failure always means the same thing regardless
# of lane:
#
#   * user-lane       -- exactly `npx @spuentesp/lain-mcp`, with CI
#                         explicitly unset for that subprocess (GitHub
#                         Actions sets CI=true ambiently; the installer's
#                         own CI-skip logic would otherwise turn this into
#                         a no-op install). The normal human path.
#   * automation-lane  -- CI=true + LAIN_FORCE_INSTALL=1, the documented
#                         escape hatch for CI callers that still want a
#                         real install. Both lanes use a fresh, isolated
#                         cache dir, require an actual downloaded binary,
#                         and verify a second invocation reuses the cache
#                         instead of re-downloading.
#   * release-gate     -- downloads the exact published release tarball +
#                         SHA256SUMS directly from GitHub Releases
#                         (bypassing npm entirely), verifies the checksum,
#                         and runs the same protocol check against the
#                         extracted binary.
#
# Known current-state caveat: this tests whatever is *already published*.
# get_capabilities and the central readiness gate this check requires
# shipped on branch spuentesp/brittlestar, not in any release published as
# of this workflow's addition -- so user-lane and automation-lane are
# expected to fail against today's published package until a release
# includes that work. That is this gate doing its job, not a bug in it.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag for the release-gate job (defaults to the latest release)'
        required: false
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]

# Deny everything by default; each job grants only what it needs.
permissions: {}

env:
  # Roadmap steps 6/9-11: bounded, but generous enough for a cold LSP
  # start on a loaded runner. The fixture is tiny (two functions), so a
  # healthy install reaches `ready` in well under this on every platform.
  INDEX_BUDGET_SECONDS: '120'
  REQUEST_TIMEOUT_SECONDS: '60'

jobs:
  user-lane:
    # A `workflow_run` trigger fires for every conclusion (including
    # failure/cancelled); only chase a successful Release.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Clean room, user lane (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fresh isolated cache directory
        shell: bash
        run: echo "LAIN_CACHE_DIR=${{ runner.temp }}/lain-user-cache" >> "$GITHUB_ENV"

      # Roadmap step 2: run the public install command with CI and
      # LAIN_FORCE_INSTALL unset in *this subprocess*, exercising the
      # normal user path -- GitHub Actions sets CI=true ambiently, so
      # this step must explicitly clear it or the installer's own
      # CI-skip logic silently turns every step below into a no-op.
      - name: npx --version (unforced user path)
        shell: bash
        env:
          CI: ''
        run: npx -y @spuentesp/lain-mcp --version

      - name: Require an actual downloaded binary
        shell: bash
        run: |
          python3 scripts/assert_cached_binary.py \
            --cache-dir "$LAIN_CACHE_DIR" \
            --snapshot "${{ runner.temp }}/user-lane-snapshot.json" \
            record

      - name: Second invocation reuses the cache
        shell: bash
        env:
          CI: ''
        run: |
          npx -y @spuentesp/lain-mcp --version
          python3 scripts/assert_cached_binary.py \
            --cache-dir "$LAIN_CACHE_DIR" \
            --snapshot "${{ runner.temp }}/user-lane-snapshot.json" \
            verify-unchanged

      - name: Create fixture repository
        shell: bash
        run: bash scripts/make-clean-room-fixture.sh "${{ runner.temp }}/fixture"

      - name: lain doctor --json
        shell: bash
        env:
          CI: ''
        run: npx -y @spuentesp/lain-mcp doctor --json --workspace "${{ runner.temp }}/fixture"

      - name: MCP protocol round trip
        shell: bash
        env:
          CI: ''
        run: |
          python3 scripts/clean_room_mcp_check.py \
            --workspace "${{ runner.temp }}/fixture" \
            --index-budget-seconds "$INDEX_BUDGET_SECONDS" \
            --request-timeout "$REQUEST_TIMEOUT_SECONDS" \
            -- npx -y @spuentesp/lain-mcp mcp

  automation-lane:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Clean room, automation lane (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fresh isolated cache directory
        shell: bash
        run: echo "LAIN_CACHE_DIR=${{ runner.temp }}/lain-automation-cache" >> "$GITHUB_ENV"

      # Roadmap: "Add a separate automation lane with both CI=true and
      # LAIN_FORCE_INSTALL=1" -- the documented escape hatch for a CI
      # caller (unlike user-lane, which unsets CI to test the human path).
      - name: npx --version (forced install path)
        shell: bash
        env:
          CI: 'true'
          LAIN_FORCE_INSTALL: '1'
        run: npx -y @spuentesp/lain-mcp --version

      - name: Require an actual downloaded binary
        shell: bash
        run: |
          python3 scripts/assert_cached_binary.py \
            --cache-dir "$LAIN_CACHE_DIR" \
            --snapshot "${{ runner.temp }}/automation-lane-snapshot.json" \
            record

      - name: Second invocation reuses the cache
        shell: bash
        env:
          CI: 'true'
          LAIN_FORCE_INSTALL: '1'
        run: |
          npx -y @spuentesp/lain-mcp --version
          python3 scripts/assert_cached_binary.py \
            --cache-dir "$LAIN_CACHE_DIR" \
            --snapshot "${{ runner.temp }}/automation-lane-snapshot.json" \
            verify-unchanged

      - name: Create fixture repository
        shell: bash
        run: bash scripts/make-clean-room-fixture.sh "${{ runner.temp }}/fixture"

      - name: MCP protocol round trip
        shell: bash
        env:
          CI: 'true'
          LAIN_FORCE_INSTALL: '1'
        run: |
          python3 scripts/clean_room_mcp_check.py \
            --workspace "${{ runner.temp }}/fixture" \
            --index-budget-seconds "$INDEX_BUDGET_SECONDS" \
            --request-timeout "$REQUEST_TIMEOUT_SECONDS" \
            -- npx -y @spuentesp/lain-mcp mcp

  release-gate:
    # Only meaningful against a real release: an explicit tag input, or a
    # completed Release run. Not part of the schedule (the two lanes
    # above already cover "is the published npm path healthy" nightly;
    # this is specifically "does the artifact this tag just published
    # work," gated on that tag existing).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: Release gate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download release artifact and SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${{ runner.temp }}/release"
          gh release download "${{ steps.tag.outputs.tag }}" \
            --dir "${{ runner.temp }}/release" \
            --pattern "lain-${{ steps.tag.outputs.version }}-${{ matrix.target }}.tar.gz" \
            --pattern 'SHA256SUMS'

      - name: Verify checksum against the published SHA256SUMS
        shell: bash
        working-directory: ${{ runner.temp }}/release
        run: |
          python3 - "lain-${{ steps.tag.outputs.version }}-${{ matrix.target }}.tar.gz" <<'PYEOF'
          import hashlib
          import sys

          archive = sys.argv[1]
          expected = None
          with open("SHA256SUMS") as f:
              for line in f:
                  digest, _, name = line.strip().partition("  ")
                  name = name or line.strip().split()[-1]
                  if name.endswith(archive):
                      expected = digest
                      break
          if expected is None:
              sys.exit(f"::error::{archive} not listed in SHA256SUMS")

          h = hashlib.sha256()
          with open(archive, "rb") as f:
              for chunk in iter(lambda: f.read(1 << 20), b""):
                  h.update(chunk)
          actual = h.hexdigest()
          if actual != expected:
              sys.exit(f"::error::checksum mismatch for {archive}: expected {expected}, got {actual}")
          print(f"checksum verified: {archive} {actual}")
          PYEOF

      - name: Extract
        shell: bash
        working-directory: ${{ runner.temp }}/release
        run: tar xzf "lain-${{ steps.tag.outputs.version }}-${{ matrix.target }}.tar.gz"

      - name: Verify --version matches the tag
        shell: bash
        working-directory: ${{ runner.temp }}/release
        run: |
          BIN=./lain
          [ "${{ matrix.os }}" = "windows-latest" ] && BIN=./lain.exe
          chmod +x "$BIN" 2>/dev/null || true
          "$BIN" --version

      - name: Create fixture repository
        shell: bash
        run: bash scripts/make-clean-room-fixture.sh "${{ runner.temp }}/fixture"

      - name: lain doctor --json
        shell: bash
        run: |
          BIN="${{ runner.temp }}/release/lain"
          [ "${{ matrix.os }}" = "windows-latest" ] && BIN="${{ runner.temp }}/release/lain.exe"
          "$BIN" doctor --json --workspace "${{ runner.temp }}/fixture"

      - name: MCP protocol round trip against the extracted binary
        shell: bash
        run: |
          BIN="${{ runner.temp }}/release/lain"
          [ "${{ matrix.os }}" = "windows-latest" ] && BIN="${{ runner.temp }}/release/lain.exe"
          python3 scripts/clean_room_mcp_check.py \
            --workspace "${{ runner.temp }}/fixture" \
            --index-budget-seconds "$INDEX_BUDGET_SECONDS" \
            --request-timeout "$REQUEST_TIMEOUT_SECONDS" \
            -- "$BIN" mcp
