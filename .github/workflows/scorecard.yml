name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly off-peak (Mon 05:17 UTC). Picks a non-:00 minute to
    # avoid contention with other public repos hitting the same API.
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Deny everything by default; grant only what the job needs.
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The main branch ruleset exposes protection settings to the
          # default token, so no separate administrative PAT is needed.

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard

      - name: Upload scorecard artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-${{ github.sha }}
          path: results.sarif
          if-no-files-found: error
