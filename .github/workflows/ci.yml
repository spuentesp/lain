name: CI

# Triggers on both main and dev. Job-level `if:` conditions keep
# `version-drift`, `coverage`, and the agent-required jobs scoped to
# main where they belong; the rest of the matrix runs on both
# branches so PRs targeting dev drive the agent-contract rollup.
#
# Tiered so a broken build is cheap to see and doesn't burn the
# expensive jobs finding out: every job used to fire in parallel with
# no `needs:` at all, so a `cargo fmt` typo still paid for the full
# 3-OS test matrix, a release build for schema-drift, and another for
# capability, before anyone looked at the result.
#
#   Tier 0 (parallel with tier 1): changes. A cheap git-diff
#     classification other jobs read via `needs.changes.outputs`.
#   Tier 1 (fast, parallel, gates everything below): lint, npm-shim,
#     action-contracts. Each is a few minutes at most and needs no
#     release build.
#   Tier 2 (needs: all of tier 1): test (the 3-OS matrix), capability,
#     schema-drift, health-badge, version-drift.
#   Tier 3 (needs: tier 2's `test`, main-push only): coverage.
#
# Trade-off, deliberately accepted: a fully green run now takes
# tier-1-time + tier-2-time back to back instead of max(tier 1, tier
# 2) in parallel. The point is cheap iteration while a PR still has
# red jobs, which is the common case during active development, not
# the fastest possible time-to-green on an already-passing PR.
#
# Two more cuts on top of the tier graph, both scoped to Tier 2 only
# (Tier 1 always runs, even in draft, so a draft PR still gets fast
# lint/npm-shim/contracts feedback):
#   - Draft PRs skip Tier 2 (`github.event.pull_request.draft != true`).
#     A push event has no `pull_request` context, so this evaluates to
#     `null != true` (true) there and never affects push-triggered runs.
#   - Docs-only changes skip the expensive rust-matrix jobs (`test`,
#     `capability`, `schema-drift`) via the `changes` job's
#     `docs_only` output. The classifier defaults to `false` (run
#     everything) whenever it can't establish a diff base, so an
#     unrecognized file type or force-push never silently skips a
#     real code change.
#
# Job `name:` values are unchanged by the tiering — agent-contract.yml
# matches jobs by name via a `workflow_run` rollup after this whole
# workflow completes, so renaming any of "Capability suite (demo.sh)",
# "Tool schema matches docs/tool-schema.json", or "npm-shim install
# tests" would silently break that regex.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Rapid-prototyping best practice: a PR that gets three pushes in two
# minutes used to run three full CI pipelines in parallel, each paying
# for its own 3-OS matrix. Only the latest push on a given ref matters,
# so cancel whatever's still in flight for that ref when a new run
# starts. `github.head_ref` is only set for pull_request events; the
# `|| github.ref` fallback gives push events (main/dev) their own
# per-branch group instead of colliding with an empty string.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Top-level `permissions: {}` denies everything by default; each job
# grants only what it needs (mirroring safeskill.yml's posture).
# Dependabot keeps the SHA-pinned action versions current.
permissions: {}

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          # Any uncertainty about the diff range (new branch, force-push,
          # missing context) defaults to docs_only=false -- run the full
          # matrix. The only way to skip it is a diff this script can
          # positively classify as docs-only, never the absence of one.
          if [ -z "$BASE" ] || [ -z "$HEAD" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Could not determine a diff base; running full matrix."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          if [ -z "$CHANGED" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running full matrix."
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Conservative allowlist: every changed file must match one of
          # these patterns for the run to count as docs-only. Anything
          # unrecognized counts as code.
          NON_DOCS=$(echo "$CHANGED" | grep -vE '(\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/|^\.gitignore$)' || true)
          if [ -z "$NON_DOCS" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "All changed files match the docs-only allowlist."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Non-docs files changed:"
            echo "$NON_DOCS"
          fi

  test:
    name: Cargo Test (${{ matrix.os }})
    needs: [lint, npm-shim, action-contracts, changes]
    if: needs.changes.outputs.docs_only != 'true' && github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    # A hung test (this session hit a real one: a subprocess reader
    # with no timeout blocking forever) must fail the job, not sit on
    # the runner queue for the 360-minute GitHub default.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake git

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # Swatinem/rust-cache keys on Cargo.lock + os + toolchain, so each
      # matrix cell gets its own target/ cache. The cross-run speedup
      # within one OS is what the original ubuntu-only job relied on.
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # 17 tests in `tests/use_cases/battery_*` invoke the `lain` binary at
      # `target/debug/lain` and panic with a helpful message if it is
      # missing. Building it here (rather than relying on `cargo test`
      # to incidentally produce it) keeps the panic-fallback dead and
      # the Windows matrix cell green.
      - name: Build lain binary (for use_cases/battery_* tests that invoke it as a subprocess)
        shell: bash
        run: cargo build --bin lain

      - name: Run tests
        shell: bash
        run: cargo test --workspace

      # Every `mod foo;` must resolve to a *committed* file. Catches the
      # failure local tests structurally cannot: the module compiles from
      # the working tree while the commit omits the file, so a clean
      # checkout fails with E0583. The script called itself a pre-push
      # check and nothing ever invoked it.
      - name: Module declarations resolve to committed files
        shell: bash
        run: bash scripts/check-mod-resolution.sh

      - name: Run JS tests
        shell: bash
        run: |
          cd tests/js
          npm ci
          npm test

  capability:
    name: Capability suite (demo.sh)
    needs: [lint, npm-shim, action-contracts, changes]
    if: needs.changes.outputs.docs_only != 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake git

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary
        run: cargo build --release

      # `scripts/demo.sh` boots a real server against a fixture whose call
      # graph is known by construction and asserts lain's answers against
      # that ground truth — 113 checks, and the claim the README leads
      # with. Nothing ran it, so it could rot between manual invocations
      # and the README would keep advertising it.
      - name: Ground-truth capability checks
        run: bash scripts/demo.sh --quick

  health-badge:
    name: Lain architecture health badge
    needs: [lint, npm-shim, action-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    # The action posts a commit status and a PR comment. The default
    # GITHUB_TOKEN is read-only; grant the scopes the steps need.
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Self-reference: use the action at HEAD, the same commit the
      # workflow is shipping in. Consumers pin to a tag (see the
      # action's README); the same repo cannot pin to a tag that
      # does not exist yet on the first release run.
      - uses: ./.github/actions/lain-health-badge
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          min-fan-out: '15'

  version-drift:
    name: lain-version default tracks latest release
    needs: [lint, npm-shim, action-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # The drift check runs on main, where release tags are pushed.
    # On PRs the comparison would fail the moment a new tag is cut,
    # before the bump PR can land. Run only on push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract pinned version from action.yml
        id: pinned
        run: |
          # Print from the `lain-version:` line to the first `default:`
          # line, then extract the vX.Y.Z token. Robust to YAML layout.
          PINNED=$(sed -n '/lain-version:/,/default:/p' .github/actions/lain-health-badge/action.yml \
            | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          if [ -z "$PINNED" ]; then
            echo "::error::could not parse lain-version default from action.yml"
            exit 1
          fi
          echo "version=${PINNED}" >> "$GITHUB_OUTPUT"
          echo "Pinned default: ${PINNED}"
      - name: Fetch latest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName --jq .tagName)
          if [ -z "$TAG" ]; then
            echo "::error::no releases found on this repo"
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${TAG}"
      - name: Check
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          if [ "$PINNED" != "$LATEST" ]; then
            echo "::error::action.yml pins $PINNED but latest release is $LATEST"
            echo "::error::bump the 'lain-version' default in .github/actions/lain-health-badge/action.yml"
            exit 1
          fi
          echo "OK: pinned ($PINNED) == latest ($LATEST)"

  lint:
    name: Lint + format + doc tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # These checks aren't OS-specific — ubuntu runs them once and
    # the three test-matrix cells pick up the rest. Failures here
    # block merge regardless of the test matrix's color.
    #
    # Tier 1: no `needs:` — this is one of the fast gates everything
    # else waits on.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `cargo fmt --check` — URGENT FIXES #6 baseline. Pre-fix,
      # formatting was unchecked and drifted (~30 diffs in
      # committed code, per `docs/CI.md`). The companion commit
      # on this branch ("style: cargo fmt --all baseline") made
      # the tree conform to current rustfmt; this job keeps it
      # there going forward.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # `cargo clippy -- -D warnings` — promotes lints to errors
      # so a new warning is a CI failure, not a "we'll fix it
      # later" footnote. `--workspace --all-targets` covers
      # integration tests and benches too. The allow list silences
      # noisy lint families that produce ~200 warnings in the
      # current tree (style/complexity/perf/pedantic) and unrelated
      # test-helper dead-code warnings that clippy can't see across
      # test crates. The strict correctness subset is what blocks
      # merges here.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::style -A clippy::complexity -A clippy::perf -A clippy::pedantic -A unused -A dead_code
      # Doc tests — `cargo test --workspace` runs them, but
      # they're cheap to run separately and a dedicated job makes
      # it easy to bisect when a doc example drifts.
      - name: cargo test --doc
        run: cargo test --workspace --doc

  schema-drift:
    name: Tool schema matches docs/tool-schema.json
    needs: [lint, npm-shim, action-contracts, changes]
    if: needs.changes.outputs.docs_only != 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The drift check is the documented contract (docs/CI.md §
    # "Schema drift"): `lain schema dump` is the canonical tool-
    # surface JSON; `docs/tool-schema.json` is the on-disk copy.
    # A non-empty `git diff` on the regenerated file fails CI,
    # forcing the PR to include the regenerated snapshot.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake git
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release binary
        run: cargo build --release
      - name: Regenerate schema
        run: ./target/release/lain schema dump --out /tmp/schema.json
      - name: Diff against committed snapshot
        run: |
          if ! diff -u docs/tool-schema.json /tmp/schema.json; then
            echo "::error::docs/tool-schema.json is out of date. \
                  Run \`make schema\` (or \`./target/release/lain \
                  schema dump --out docs/tool-schema.json\`) and \
                  commit the result."
            exit 1
          fi
          echo "OK: docs/tool-schema.json matches the live schema"

  npm-shim:
    name: npm-shim install tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The npm shim resolves, verifies, caches, and launches release binaries.
    # Its tests exercise the shipped runtime module rather than copied logic.
    #
    # Tier 1: no `needs:` — runs in parallel with lint/action-contracts.
    defaults:
      run:
        working-directory: npm-shim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 was deprecated on github-actions runners on
          # 2025-09-19; bumped to 22 (LTS, current default). The
          # npm-shim's `engines.node` is `>=18`, so 22 is in range.
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Inspect published package contents
        run: npm pack --dry-run


  coverage:
    # Coverage run is intentionally restricted to push-to-main. PRs
    # already pay the `cargo test --workspace` cost on every OS; adding
    # a coverage build per PR would lengthen the queue without changing
    # the merge signal (codecov.io still annotates PRs from the latest
    # main-branch upload). Until a baseline is chosen, the upload
    # never fails CI: `fail_ci_if_error: false` plus codecov.yml's
    # target=0/threshold=0 settings keep the badge dark until the
    # first deliberate baseline PR.
    #
    # Tier 3: waits on tier 2's `test` (all three OS cells) rather than
    # just tier 1. A push to main has normally already passed `test` in
    # the PR that merged it, but re-deriving coverage from a run that's
    # already known broken would just be more wasted minutes.
    name: Coverage (cargo llvm-cov)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake git

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-llvm-cov

      - name: Build lain binary (for use_cases/battery_* tests that invoke it as a subprocess)
        # 17 tests in `tests/use_cases/battery_*` invoke the `lain`
        # binary and panic with a helpful message if it is missing.
        # `cargo llvm-cov` defaults to a separate target_dir
        # (target/llvm-cov-target), so the build here uses the same
        # --target-dir the next step will use, keeping the binary at
        # the path the tests expect.
        run: cargo build --bin lain --target-dir target

      - name: Generate coverage
        # CARGO_TARGET_DIR matches the explicit --target-dir on the
        # build step above. cargo-llvm-cov's CLI rejects --target-dir
        # as a flag, so the equivalent is set as an env var.
        env:
          CARGO_TARGET_DIR: target
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: false


  action-contracts:
    name: Badge and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Tier 1: no `needs:` — runs in parallel with lint/npm-shim.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Release metadata consistency
        run: python scripts/check-release-version.py
      - name: Release provenance export tests
        run: python scripts/test_release_provenance.py
      - name: Release gate regression tests
        run: python scripts/test_release_version.py
      # METADATA.toml / server.json / sync-server-json.py drift gate.
      # Added in PR #2; the smoke test catches drift the version check
      # ignores (description / homepage / keywords / repository.url).
      - name: Canonical metadata sync gate
        run: python scripts/test_sync_metadata.py
      # Fast, network-free unit tests for the Milestone 9 clean-room
      # check script (reader-thread timeout handling, protocol-violation
      # detection) against a fake in-process server. The real live-network
      # run against a published `npx @spuentesp/lain-mcp` lives in
      # distribution-acceptance.yml, not here -- it exercises external
      # published state, not this diff, so it doesn't belong on every PR.
      - name: Clean-room check script unit tests
        run: python scripts/test_clean_room_mcp_check.py
      - name: Cached-binary assertion helper unit tests
        run: python scripts/test_assert_cached_binary.py
      - name: Action configuration and version pinning
        run: python .github/actions/lain-health-badge/tests/test_action.py
      - name: Badge extraction
        run: bash .github/actions/lain-health-badge/tests/test_extract_added_fns.sh
      - name: Installer checks
        run: bash tests/install-test.sh
