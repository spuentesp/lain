name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Cargo Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake git

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      # Swatinem/rust-cache keys on Cargo.lock + os + toolchain, so each
      # matrix cell gets its own target/ cache. The cross-run speedup
      # within one OS is what the original ubuntu-only job relied on.
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 17 tests in `tests/use_cases/battery_*` invoke the `lain` binary at
      # `target/debug/lain` and panic with a helpful message if it is
      # missing. Building it here (rather than relying on `cargo test`
      # to incidentally produce it) keeps the panic-fallback dead and
      # the Windows matrix cell green.
      - name: Build lain binary (for use_cases/battery_* tests that invoke it as a subprocess)
        shell: bash
        run: cargo build --bin lain

      - name: Run tests
        shell: bash
        run: cargo test --workspace

      # Every `mod foo;` must resolve to a *committed* file. Catches the
      # failure local tests structurally cannot: the module compiles from
      # the working tree while the commit omits the file, so a clean
      # checkout fails with E0583. The script called itself a pre-push
      # check and nothing ever invoked it.
      - name: Module declarations resolve to committed files
        shell: bash
        run: bash scripts/check-mod-resolution.sh

      - name: Run JS tests
        shell: bash
        run: |
          cd tests/js
          npm ci || npm install
          npm test

  capability:
    name: Capability suite (demo.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake git

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      # `scripts/demo.sh` boots a real server against a fixture whose call
      # graph is known by construction and asserts lain's answers against
      # that ground truth — 113 checks, and the claim the README leads
      # with. Nothing ran it, so it could rot between manual invocations
      # and the README would keep advertising it.
      - name: Ground-truth capability checks
        run: bash scripts/demo.sh --quick

  health-badge:
    name: Lain architecture health badge
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # The action posts a commit status and a PR comment. The default
    # GITHUB_TOKEN is read-only; grant the scopes the steps need.
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # Self-reference: use the action at HEAD, the same commit the
      # workflow is shipping in. Consumers pin to a tag (see the
      # action's README); the same repo cannot pin to a tag that
      # does not exist yet on the first release run.
      - uses: ./.github/actions/lain-health-badge
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          min-fan-out: '15'

  version-drift:
    name: lain-version default tracks latest release
    runs-on: ubuntu-latest
    # The drift check runs on main, where release tags are pushed.
    # On PRs the comparison would fail the moment a new tag is cut,
    # before the bump PR can land. Run only on push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned version from action.yml
        id: pinned
        run: |
          # Print from the `lain-version:` line to the first `default:`
          # line, then extract the vX.Y.Z token. Robust to YAML layout.
          PINNED=$(sed -n '/lain-version:/,/default:/p' .github/actions/lain-health-badge/action.yml \
            | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          if [ -z "$PINNED" ]; then
            echo "::error::could not parse lain-version default from action.yml"
            exit 1
          fi
          echo "version=${PINNED}" >> "$GITHUB_OUTPUT"
          echo "Pinned default: ${PINNED}"
      - name: Fetch latest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName --jq .tagName)
          if [ -z "$TAG" ]; then
            echo "::error::no releases found on this repo"
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${TAG}"
      - name: Check
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          if [ "$PINNED" != "$LATEST" ]; then
            echo "::error::action.yml pins $PINNED but latest release is $LATEST"
            echo "::error::bump the 'lain-version' default in .github/actions/lain-health-badge/action.yml"
            exit 1
          fi
          echo "OK: pinned ($PINNED) == latest ($LATEST)"

  lint:
    name: Lint + format + doc tests
    runs-on: ubuntu-latest
    # These checks aren't OS-specific — ubuntu runs them once and
    # the three test-matrix cells pick up the rest. Failures here
    # block merge regardless of the test matrix's color.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      # `cargo fmt --check` — URGENT FIXES #6 baseline. Pre-fix,
      # formatting was unchecked and drifted (~30 diffs in
      # committed code, per `docs/CI.md`). The companion commit
      # on this branch ("style: cargo fmt --all baseline") made
      # the tree conform to current rustfmt; this job keeps it
      # there going forward.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # `cargo clippy -- -D warnings` — promotes lints to errors
      # so a new warning is a CI failure, not a "we'll fix it
      # later" footnote. `--workspace --all-targets` covers
      # integration tests and benches too. The allow list silences
      # noisy lint families that produce ~200 warnings in the
      # current tree (style/complexity/perf/pedantic) and unrelated
      # test-helper dead-code warnings that clippy can't see across
      # test crates. The strict correctness subset is what blocks
      # merges here.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::style -A clippy::complexity -A clippy::perf -A clippy::pedantic -A unused -A dead_code
      # Doc tests — `cargo test --workspace` runs them, but
      # they're cheap to run separately and a dedicated job makes
      # it easy to bisect when a doc example drifts.
      - name: cargo test --doc
        run: cargo test --workspace --doc

  schema-drift:
    name: Tool schema matches docs/tool-schema.json
    runs-on: ubuntu-latest
    # The drift check is the documented contract (docs/CI.md §
    # "Schema drift"): `lain schema dump` is the canonical tool-
    # surface JSON; `docs/tool-schema.json` is the on-disk copy.
    # A non-empty `git diff` on the regenerated file fails CI,
    # forcing the PR to include the regenerated snapshot.
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake git
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Regenerate schema
        run: ./target/release/lain schema dump --out /tmp/schema.json
      - name: Diff against committed snapshot
        run: |
          if ! diff -u docs/tool-schema.json /tmp/schema.json; then
            echo "::error::docs/tool-schema.json is out of date. \
                  Run \`make schema\` (or \`./target/release/lain \
                  schema dump --out docs/tool-schema.json\`) and \
                  commit the result."
            exit 1
          fi
          echo "OK: docs/tool-schema.json matches the live schema"

  npm-shim:
    name: npm-shim install tests
    runs-on: ubuntu-latest
    # The npm-shim is what `npm install lain-mcp` runs. Its install
    # script (`scripts/install.js`) is the only piece of JavaScript
    # that ships to end users; tests in `scripts/install.test.js`
    # were not on any CI matrix (URGENT FIXES #6). Failures here
    # would silently break every consumer install.
    defaults:
      run:
        working-directory: npm-shim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test

