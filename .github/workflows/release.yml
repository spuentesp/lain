name: Release

on:
  push:
    tags:
      - 'v*'

# Top-level `permissions: {}` denies everything by default; jobs grant
# only what they need. PR #2 changes vs PR #1:
#
#   - build-* jobs gain `id-token: write` for SLSA-style build
#     provenance attestation (actions/attest-build-provenance needs it).
#   - Per-binary SBOM generation via anchore/sbom-action (syft).
#   - Per-binary SHA256 side-file via scripts/compute-sha256.py.
#   - A new `sha256sums` job aggregates per-binary hashes into the
#     SHA256SUMS file attached to the release.
#   - `publish-server-json` now derives server.json from
#     docs/METADATA.toml + the release tag, updating ALL
#     `"version":` fields (top-level AND packages[].version). The
#     previous sed only matched the first occurrence.
permissions: {}

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify release tag and package metadata
        run: python scripts/check-release-version.py --tag "$GITHUB_REF_NAME"
      # Compute SOURCE_DATE_EPOCH as a Unix-epoch INTEGER here. The
      # shell-only `date -d` form below proved brittle on this runner
      # (the redirect to $GITHUB_OUTPUT silently produced an empty
      # value, leaving build jobs with SOURCE_DATE_EPOCH='').
      # Computing via python3 is portable across Linux + macOS
      # runners, uses an already-set-up tool, and writes through
      # Python's file API which is straightforward to reason about.
      # Build jobs consume it via
      # `needs.version-check.outputs.epoch` so all three platforms
      # share the same fixed value per workflow run.
      - name: Compute reproducible-build epoch
        id: epoch
        env:
          UPDATED_AT: ${{ github.event.repository.updated_at }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone
          iso = os.environ['UPDATED_AT'].replace('Z', '+00:00')
          epoch = int(datetime.fromisoformat(iso).timestamp())
          print(f"epoch={epoch}")
          PY
          echo "epoch-output-debug: $(tail -n 1 "$GITHUB_OUTPUT")"

  build-linux:
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        id: version
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      # Reproducible-build environment variables. SOURCE_DATE_EPOCH
      # normalizes embedded timestamps; CARGO_INCREMENTAL=0 drops
      # absolute-path incremental compilation artifacts. Full
      # byte-identical reproduction still requires a pinned
      # rust-toolchain.toml, which is the next iteration.
      - name: Build
        env:
          SOURCE_DATE_EPOCH: ${{ needs.version-check.outputs.epoch }}
          CARGO_INCREMENTAL: '0'
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify built version before publishing
        shell: bash
        run: python scripts/check-release-version.py --tag "$GITHUB_REF_NAME" --binary target/x86_64-unknown-linux-gnu/release/lain
      - name: Package tarball
        run: |
          mkdir -p release
          cp target/x86_64-unknown-linux-gnu/release/lain release/lain
          tar czf release/lain-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz -C release lain
          rm release/lain
      - name: Compute per-binary SHA256
        run: python scripts/compute-sha256.py release/lain-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz
      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          file: release/lain-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz
          output-file: release/lain-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz.cdx.json
          upload-release-assets: false
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/lain-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz
      - name: Export signed provenance for release downloads
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          ARTIFACT_PATH: release/lain-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/export-release-provenance.py "$BUNDLE_PATH" "$ARTIFACT_PATH"
          gh attestation verify "$ARTIFACT_PATH" --repo "$GITHUB_REPOSITORY" \
            --bundle "$ARTIFACT_PATH.sigstore.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/lain-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz
            release/lain-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz.sha256
            release/lain-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz.cdx.json
            release/lain-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz.sigstore.json
            release/lain-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz.intoto.jsonl
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    needs: version-check
    runs-on: macos-14
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        id: version
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Build
        env:
          SOURCE_DATE_EPOCH: ${{ needs.version-check.outputs.epoch }}
          CARGO_INCREMENTAL: '0'
        run: cargo build --release --target aarch64-apple-darwin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify built version before publishing
        shell: bash
        run: python scripts/check-release-version.py --tag "$GITHUB_REF_NAME" --binary target/aarch64-apple-darwin/release/lain
      - name: Package tarball
        run: |
          mkdir -p release
          cp target/aarch64-apple-darwin/release/lain release/lain
          tar czf release/lain-${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz -C release lain
          rm release/lain
      - name: Compute per-binary SHA256
        run: python scripts/compute-sha256.py release/lain-${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz
      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          file: release/lain-${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz
          output-file: release/lain-${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz.cdx.json
          upload-release-assets: false
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/lain-${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz
      - name: Export signed provenance for release downloads
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          ARTIFACT_PATH: release/lain-${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/export-release-provenance.py "$BUNDLE_PATH" "$ARTIFACT_PATH"
          gh attestation verify "$ARTIFACT_PATH" --repo "$GITHUB_REPOSITORY" \
            --bundle "$ARTIFACT_PATH.sigstore.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/lain-${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz
            release/lain-${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz.sha256
            release/lain-${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz.cdx.json
            release/lain-${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz.sigstore.json
            release/lain-${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz.intoto.jsonl
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: version-check
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        id: version
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Build
        env:
          SOURCE_DATE_EPOCH: ${{ needs.version-check.outputs.epoch }}
          CARGO_INCREMENTAL: '0'
        run: cargo build --release --target x86_64-pc-windows-msvc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify built version before publishing
        shell: bash
        run: python scripts/check-release-version.py --tag "$GITHUB_REF_NAME" --binary target/x86_64-pc-windows-msvc/release/lain.exe
      - name: Package tarball
        shell: bash
        run: |
          mkdir -p release
          cp target/x86_64-pc-windows-msvc/release/lain.exe release/lain.exe
          tar czf release/lain-${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.tar.gz -C release lain.exe
          rm release/lain.exe
      - name: Compute per-binary SHA256
        shell: bash
        run: python scripts/compute-sha256.py release/lain-${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.tar.gz
      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          file: release/lain-${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.tar.gz
          output-file: release/lain-${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.tar.gz.cdx.json
          upload-release-assets: false
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/lain-${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.tar.gz
      - name: Export signed provenance for release downloads
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          ARTIFACT_PATH: release/lain-${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.tar.gz
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/export-release-provenance.py "$BUNDLE_PATH" "$ARTIFACT_PATH"
          gh attestation verify "$ARTIFACT_PATH" --repo "$GITHUB_REPOSITORY" \
            --bundle "$ARTIFACT_PATH.sigstore.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/lain-${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.tar.gz
            release/lain-${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.tar.gz.sha256
            release/lain-${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.tar.gz.cdx.json
            release/lain-${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.tar.gz.sigstore.json
            release/lain-${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.tar.gz.intoto.jsonl
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Aggregate the three per-binary tarballs into a single SHA256SUMS
  # file and attach it to the release. Downloading via
  # `gh release download` (rather than cross-job artifacts) means the
  # SHA256SUMS file is computed against the exact bytes consumers will
  # receive — there is no separate attacker-controlled surface.
  sha256sums:
    needs: [build-linux, build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Download release tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "$GITHUB_REF_NAME" \
            --dir artifacts \
            --pattern 'lain-*-*.tar.gz'
      - name: Compute aggregate SHA256SUMS
        run: |
          cd artifacts
          version="${GITHUB_REF_NAME#v}"
          python ../scripts/compute-sha256.py \
            "lain-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "lain-${version}-aarch64-apple-darwin.tar.gz" \
            "lain-${version}-x86_64-pc-windows-msvc.tar.gz" > SHA256SUMS
          # Compute writes sidecars, but we only want the aggregate
          # file. The output above contains all tarball hashes.
          rm -f lain-*-*.tar.gz.sha256
          cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-server-json:
    needs: [sha256sums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        id: version
      # The previous release.yml sed-edited only the first "version"
      # field it found, leaving packages[].version drifted from the
      # top-level version. sync-server-json.py updates both, plus
      # description / homepage / keywords / repository.url from
      # docs/METADATA.toml.
      - name: Sync server.json from METADATA.toml
        run: python scripts/sync-server-json.py --version "${{ steps.version.outputs.VERSION }}"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: server.json
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the npm shim to the @spuentesp/lain-mcp package on the
  # public npm registry. This is the check that flips the OpenSSF
  # Scorecard `Packaging` check from -1 to 10 — the existing release
  # workflow uploads binaries via softprops/action-gh-release, but
  # scorecard only recognises `npm publish` / `cargo publish` /
  # `gem push` as a "packaging workflow".
  #
  # Authentication uses npm Trusted Publishing (OIDC), not a long-lived
  # token. The job's `id-token: write` permission is what makes this
  # work — npm picks up `ACTIONS_ID_TOKEN_REQUEST_TOKEN` /
  # `ACTIONS_ID_TOKEN_REQUEST_URL` from the runner env automatically.
  # The trusted-publisher is configured once at
  # https://www.npmjs.com/package/@spuentesp/lain-mcp/access
  # (Repository: spuentesp/lain, Workflow filename: release.yml).
  # This means no NPM_TOKEN secret to manage, rotate, or leak, and
  # the resulting `--provenance` attestation carries a verifiable
  # repo + workflow identity instead of a generic npm provenance.
  #
  # The postinstall downloads the binary from this repo's GitHub
  # release, so this job must run *after* the release assets are
  # uploaded.
  publish-npm:
    needs: [publish-server-json]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        id: version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Sync npm-shim version to release tag
        working-directory: npm-shim
        run: |
          node -e '
            const fs = require("fs");
            const path = "package.json";
            const pkg = JSON.parse(fs.readFileSync(path));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          '
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
      - name: Publish to npm
        working-directory: npm-shim
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # npm defaults to the `latest` dist-tag for every publish, which
          # would silently make a 0.7.4-rc1 the recommended install for
          # `npm install @spuentesp/lain-mcp`. Detect a prerelease suffix
          # (anything after a `-` in the version) and route the publish
          # to the `next` tag instead, leaving `latest` for stable cuts.
          case "$VERSION" in
            *-*) TAG_FLAG="--tag next" ;;
            *)    TAG_FLAG="" ;;
          esac
          npm publish --provenance --access public $TAG_FLAG
