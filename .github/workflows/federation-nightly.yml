name: Federation Nightly Benchmark

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Deny everything by default; the lone job below only needs read.
# OpenSSF Scorecard Token-Permissions check requires this default-deny
# at the workflow level rather than relying on job-level scope.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  real-multi-agent-benchmark:
    name: Real multi-agent benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake git python3 curl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install coordination core
        run: |
          npm install -g @spuentesp/zoanthrope@0.1.6
          zoanthrope --version
          REAL_BIN=$(find "$HOME/.cache/zoanthrope" -type f -name zoanthrope | head -1)
          test -n "$REAL_BIN"
          echo "ZOANTHROPE_BIN=$REAL_BIN" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release

      # Drives a real `lain server` over HTTP against this repo with 6
      # concurrent scripted agents (claim → search → blast radius →
      # heartbeat → release). Exits non-zero if p99 blows the 2s budget
      # or no advisory conflicts were exercised. Replaces the old
      # `federation_benchmark` target removed in the consolidation.
      - name: Run real multi-agent benchmark
        run: bash tests/e2e/real-bench.sh

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-bench-report
          path: /tmp/lain-real-bench/report.md
