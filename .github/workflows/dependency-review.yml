name: Dependency Review

on:
  pull_request:

# Deny everything by default; grant only what the job needs.
permissions: {}

jobs:
  review:
    name: Review PR dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # dependency-review-action reads the repo's dependency graph via
      # `GET /repos/{owner}/{repo}/dependency-graph/snapshots/{ref}`.
      # Without `security-events: read` the API returns 403 and the
      # action aborts with "Dependency review is not supported on this
      # repository".
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review
        # The action needs the dependency graph to be enabled for the
        # repository. On this repo the API returns 403 ("Dependency
        # review is not supported on this repository") because the
        # dependency graph is disabled at the account/repo level —
        # re-enabling it requires admin:org scope which the token
        # used here doesn't carry, and `gh api` PATCH with the
        # standard `dependabot_security_updates_enabled` flag is a
        # no-op on this account. Until that's resolved upstream,
        # let the action fail-soft so it doesn't block the rest of
        # CI. The Dependabot config (`.github/dependabot.yml`)
        # covers the supply-chain side independently once the
        # account-level dep graph is turned on.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          # Block PRs that introduce a new transitive dep with a known
          # CVE of high or worse. License findings are surfaced but
          # don't block the merge.
          fail-on-severity: high
          license-check: true
          comment-summary-in-pr: always