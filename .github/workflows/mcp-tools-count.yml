name: MCP tools count

# Refresh the "MCP Tools | <count>" Shields endpoint badge whenever
# the live tool surface changes. The badge source of truth is
# `lain schema dump`, which is the same artifact the schema-drift CI
# job checks against `docs/tool-schema.json` — so the badge can never
# disagree with the contract test by construction.

on:
  push:
    branches: [main]
    paths:
      - 'src/server/mcp/**'
      - 'src/server/tools/**'
      - 'src/cli/schema.rs'
      - '.github/workflows/mcp-tools-count.yml'
  workflow_dispatch:

permissions: {}

jobs:
  count:
    name: Refresh MCP tools count badge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6baffbcafc7e3dddab59af2b6 # v2

      - name: Build release binary
        run: cargo build --release --bin lain

      - name: Dump live schema and count tools
        id: count
        run: |
          set -euo pipefail
          ./target/release/lain schema dump --out /tmp/schema.json
          N=$(jq '. | length' /tmp/schema.json)
          echo "count=${N}" >> "$GITHUB_OUTPUT"
          echo "MCP tools count: ${N}"

      - name: Render Shields endpoint JSON
        run: |
          mkdir -p .github/badges
          jq -n \
            --argjson n '${{ steps.count.outputs.count }}' \
            --arg label 'MCP tools' \
            '{schemaVersion: 1, label: $label, message: ($n | tostring), color: "blue"}' \
            > .github/badges/mcp-tools.json
          cat .github/badges/mcp-tools.json

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: 'chore(badge): MCP tools count = ${{ steps.count.outputs.count }}'
          branch: chore/mcp-tools-count
          delete-branch: true
          title: 'chore(badge): MCP tools count = ${{ steps.count.outputs.count }}'
          body: |
            Auto-generated update to the MCP tools count Shields endpoint.

            - Source: `./target/release/lain schema dump`
            - Live count: `${{ steps.count.outputs.count }}`
            - Endpoint JSON: `.github/badges/mcp-tools.json`
            - Badge: `https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/spuentesp/lain/main/.github/badges/mcp-tools.json`

            The schema-drift CI job already enforces that
            `docs/tool-schema.json` matches this dump, so merging this
            PR keeps the badge in lock-step with the contract test.
          add-paths: .github/badges/mcp-tools.json
          signoff: false
