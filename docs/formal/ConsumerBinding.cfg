\* ConsumerBinding.cfg — ConsumerBinding.tla model-checker config.
\*
\* The `.cfg` provides the SET identifiers only. The function-bag
\* data (provider→service, service→hosts, consumer→host, and the
\* confirmed axis) is hardcoded inside the spec as operator
\* definitions, because the TLC `.cfg` parser does not accept `:>`,
\* `<<>>`, or `[|->]` syntax. The two must move together.
\*
\* All identifiers are STRING LITERALS so the `.cfg` and the
\* spec agree on them via the set constants declared here. The
\* spec's `ASSUME` block locks the scenario in so a scenario
\* change requires updating both files.
\*
\* State space: 2 providers × 2 services × 3 hosts × 6 consumers
\* (≤ 3^6 = 729 target maps; exhaustively model-checked in seconds).
\*
\* Scenario:
\*   - Services: S1 (hosts: {h1}), S2 (hosts: {h2}); h3 undeclared.
\*   - Providers: P1 ∈ S1 with key k1, P2 ∈ S2 with key k1 (shared
\*     key — the I1c ambiguity case).
\*   - Ladder consumers:
\*       C1: key k1, no host check. 2 providers match → Unresolved (I1c).
\*       C2: key k1, Literal(h1). 1 provider (P1) matches → Binds(P1).
\*       C3: key k1, Literal(h3). 0 providers match (no service
\*            declares h3) → Unresolved (I1b).
\*   - Confirmed consumers (repos.yaml#bindings, step 6):
\*       C4: key k1, no host check, pins P1 (pair (k1, k1),
\*            well-formed). The binding applies → Binds(P1) despite
\*            2 ladder matches (the I1c exception; I1d pins the
\*            target).
\*       C5: key k2, Literal(h3), pins P2 (pair (k2, k1) — a
\*            WELL-FORMED template bridge: the key strings differ,
\*            `BridgeOK` holds). The binding applies → Binds(P2)
\*            despite the unmatched host (the I1a host-clause skip
\*            and the I1b exception).
\*       C6: key k3, no host check, pins P1 (pair (k3, k1) — an
\*            ILL-FORMED cross-kind pair: `BridgeOK` is false). The
\*            fixed model ignores the binding and the ladder stands
\*            (0 matches → Unresolved). The
\*            `ConsumerBinding_Unchecked` companion drops the
\*            well-formedness check and violates I1a here.
\*
\* The I1a / I1b / I1c / I1d invariants must hold for every consumer
\* in every reachable state. (This spec documents the I1 contract
\* and serves as a regression check; the resolver and the
\* confirmed-binding override are consistent with it. Pair
\* well-formedness is the declared `BridgeOK` premise — see the
\* spec header's abstraction note.)

CONSTANTS
    Providers = {"p1", "p2"}
    Services  = {"svc1", "svc2"}
    Hosts     = {"h1", "h2", "h3"}
    Consumers = {"c1", "c2", "c3", "c4", "c5", "c6"}
    Keys      = {"k1", "k2", "k3"}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT I1a
INVARIANT I1b
INVARIANT I1c
INVARIANT I1d
