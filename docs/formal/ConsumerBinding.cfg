\* ConsumerBinding.cfg — ConsumerBinding.tla model-checker config.
\*
\* The `.cfg` provides the SET identifiers only. The function-bag
\* data (provider→service, service→hosts, consumer→host) is
\* hardcoded inside the spec as operator definitions, because the
\* TLC `.cfg` parser does not accept `:>`, `<<>>`, or `[|->]`
\* syntax. The two must move together.
\*
\* All identifiers are STRING LITERALS so the `.cfg` and the
\* spec agree on them via the set constants declared here. The
\* spec's `ASSUME` block locks the scenario in so a scenario
\* change requires updating both files.
\*
\* State space: 2 providers × 2 services × 3 hosts × 3 consumers
\* (≈ 27 distinct states; exhaustively model-checked in seconds).
\*
\* Scenario:
\*   - Services: S1 (hosts: {h1}), S2 (hosts: {h2}); h3 undeclared.
\*   - Providers: P1 ∈ S1 with key k1, P2 ∈ S2 with key k1 (shared
\*     key — the I1c ambiguity case).
\*   - Consumers:
\*       C1: key k1, no host check. 2 providers match → Unresolved (I1c).
\*       C2: key k1, Literal(h1). 1 provider (P1) matches → Binds(P1).
\*       C3: key k1, Literal(h3). 0 providers match (no service
\*            declares h3) → Unresolved (I1b).
\*
\* The I1a / I1b / I1c invariants must hold for every consumer in
\* every reachable state. (This spec documents the I1 contract and
\* serves as a regression check; the WebSocket resolver's
\* implementation is consistent with it.)

CONSTANTS
    Providers = {"p1", "p2"}
    Services  = {"svc1", "svc2"}
    Hosts     = {"h1", "h2", "h3"}
    Consumers = {"c1", "c2", "c3"}
    Keys      = {"k1", "k2"}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT I1a
INVARIANT I1b
INVARIANT I1c
