\* ScanRetract_VariantB.cfg — variant (b) of the ScanRetract
\* model. Per-sensor owners: each sensor maps to a distinct
\* `Owner` value, so `Scan(s)` cannot reach another sensor's
\* nodes through the retract step.
\*
\* The `.cfg` provides the SET identifiers only. The
\* function-bag data (sensor_owner, initial_latest_output) is
\* hardcoded inside the spec as operator definitions, because
\* the TLC `.cfg` parser does not accept `:>`, `<<>>`, or
\* `[|->]` syntax.
\*
\* State space: 2 sensors × 2 nodes × 2 owners × 4 initial-output
\* combinations (≈ 256 distinct states; exhaustively model-checked
\* in seconds).
\*
\* Scenario:
\*   - Sensors: s1, s2.
\*   - NodeIds: n1, n2.
\*   - Owners: {own1, own2} — each sensor maps to its own owner.
\*   - Initial latest output: s1 -> {n1}, s2 -> {n2}.
\*
\* The I8 invariant must hold at every reachable state. Variant
\* (a) violates it via peer deletion; this variant (b) does not.

CONSTANTS
    Sensors = {"s1", "s2"}
    NodeIds = {"n1", "n2"}
    Owners  = {"own1", "own2"}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT I8
