\* SnapshotResidency_VariantBC.cfg — combined variant-(b)/(c)
\* model of the post-fix SnapshotManager. Variant (a) violates
\* all three invariants (NoEvictionOfHeld, CapBound,
\* SingleFlight); this variant closes them.

CONSTANTS
    SnapshotIds = {s1, s2, s3}
    Cap         = 2
    MaxHolds    = 2
    MaxBuilds   = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoEvictionOfHeld
INVARIANT CapBound
INVARIANT SingleFlight