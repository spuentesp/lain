\* RejoinProtocol.cfg — RejoinProtocol.tla model-checker config.
\*
\* State space: 2 generations × 1 node × 1 edge × 2 configs × 1 reader
\* (≈ 5k states; exhaustively model-checked in seconds).

CONSTANTS
    Generations = {g1, g2}
    Nodes       = {n1}
    Edges       = {e1}
    Configs     = {c0, c1}
    Readers     = {r1}
    Unobserved  = NONE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT Convergence
INVARIANT NoLostUpdate
INVARIANT I7ReaderConsistency
