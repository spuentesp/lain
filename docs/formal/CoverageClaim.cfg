\* CoverageClaim.cfg — CoverageClaim.tla model-checker config.
\*
\* Extends the could-match clause to the non-HTTP protocol families
\* (Task 1 of docs/superpowers/plans/2026-10-07-contract-soundness.md):
\* `unresolved_cons` can hold topic/rpc/graphql/table consumers, and
\* `AddUnresolved` lets one appear at any time. An unresolved consumer
\* whose family equals `change_family` (or carries no family —
\* `unknown`) blocks `RepoComplete` and therefore the claim.
\*
\* `change_family` is pinned to `topic` — the protocol whose
\* could-match hole this extension covers. The spec is symmetric in
\* FAMILIES; pin any other member here to check that family.
CONSTANTS
    Repos = {r1, r2}
    Sensors = {httpSensor, entrySensor}
    LANGUAGES = {rust, python, java, ruby}
    CONSUMER_LANGS = {rust, python, java, ruby}
    FAMILIES = {http, topic, rpc, graphql, table, unknown}
    change_family = topic

SPECIFICATION Spec

INVARIANT NoKnownImpactSound
INVARIANT TypeOK
