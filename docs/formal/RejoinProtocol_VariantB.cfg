\* RejoinProtocol_VariantB.cfg — variant-(b) clear-before-read
\* rejoin logic. Same state space as variant (a); exhaustive
\* model-check should report no counterexamples for NoLostUpdate
\* or Convergence (the invariants variant-(a) violates).

CONSTANTS
    Generations = {g1, g2}
    Nodes       = {n1}
    Edges       = {e1}
    Configs     = {c0, c1}
    Readers     = {r1}
    Unobserved  = NONE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoLostUpdate
INVARIANT Convergence