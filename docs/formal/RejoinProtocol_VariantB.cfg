\* RejoinProtocol_VariantB.cfg — variant-(b) clear-before-read
\* rejoin logic. Same state space as variant (a); exhaustive
\* model-check should report no counterexamples for NoLostUpdate
\* or Convergence (the invariants variant-(a) violates).

CONSTANTS
    Generations = {g1, g2}
    Nodes       = {n1}
    Edges       = {e1}
    Configs     = {c0, c1}
    Readers     = {r1}
    Unobserved  = NONE

SPECIFICATION Spec

INVARIANT TypeOK
\* NoLostUpdate (`dirty \/ binds = ComputeBinds`) is deliberately NOT checked
\* here: clear-before-read makes it transiently false between the clear and
\* the recompute (dirty=FALSE, binds stale, rejoin in flight). The invariant a
\* correct protocol owes is Convergence: once no rejoin is in flight and the
\* flag is clear, binds are current. RejoinProtocolMidRejoinInvariant.cfg
\* demonstrates the transient violation.
INVARIANT Convergence