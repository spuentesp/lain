\* SnapshotResidency.cfg — SnapshotResidency.tla model-checker config.
\*
\* State space: 3 snapshot ids × cap 2 × 2 holds per id × 2 builds per id
\* (≈ 1.5M states; exhaustively model-checked in seconds).

CONSTANTS
    SnapshotIds = {s1, s2, s3}
    Cap         = 2
    MaxHolds    = 2
    MaxBuilds   = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoEvictionOfHeld
INVARIANT CapBound
INVARIANT SingleFlight
