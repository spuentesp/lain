\* ScanRetract.cfg — ScanRetract.tla model-checker config.
\*
\* Variant (a) — the BUGGY shape: two sensors share one owner.
\* TLC will find a peer-deletion counterexample.
\*
\* The `.cfg` provides the SET identifiers only. The
\* function-bag data (sensor_owner, initial_latest_output) is
\* hardcoded inside the spec as operator definitions, because
\* the TLC `.cfg` parser does not accept `:>`, `<<>>`, or
\* `[|->]` syntax. All identifiers are STRING LITERALS so the
\* `.cfg` and the spec agree on them.
\*
\* State space: 2 sensors × 2 nodes × 1 owner × 4 initial-output
\* combinations (≈ 64 distinct states; exhaustively model-checked
\* in seconds).
\*
\* Scenario:
\*   - Sensors: s1, s2.
\*   - NodeIds: n1, n2.
\*   - Owners: {shared} — both sensors map to the same owner.
\*   - Initial latest output: s1 -> {n1}, s2 -> {n2}. The two
\*     outputs differ, which is the minimum for the bug to be
\*     observable.
\*
\* The peer-deletion counterexample: `Scan(s1)` retracts every
\* node owned by `"shared"` (i.e. ALL nodes — n1 AND n2), then
\* inserts `latest_output[s1] = {n1}`. The resulting node set is
\* `{<<n1, shared>>}`, but the union of both sensors' outputs is
\* `{<<n1, shared>>, <<n2, shared>>}`. I8 fails.

CONSTANTS
    Sensors = {"s1", "s2"}
    NodeIds = {"n1", "n2"}
    Owners  = {"shared"}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT I8
