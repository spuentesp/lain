# cargo-mutants configuration (shared by `make mutants` and
# `scripts/mutation-gate.sh`; this is the default tree config path for
# cargo-mutants 27.1.0 — `cargo mutants --emit-schema config` is the
# authority on what may appear here).
#
# Timeouts are deliberately NOT set here: the schema has no absolute
# timeout keys (only multipliers, which need a measured baseline).
# `scripts/mutation-gate.sh` checks each copied-tree baseline and passes
# `--timeout 300 --build-timeout 600` on the command line; `make
# mutants` passes its own `--timeout 120`.
#
# Mutants that cannot change observable behaviour in a normal build are
# excluded with the reason, so a "missed" mutant always means a real test gap.
# (The mutation gate adds no exclusions of its own: nothing generated or
# dump-like is in cargo-mutants' examine set — see `cargo mutants
# --list-files`; its bin-target scope filter lives on the
# scripts/mutation-gate.sh command line, not here. New entries must justify
# themselves here; never add one to turn a MISSED mutant green.)
exclude_re = [
    # Test-only helper module inside lsp.rs.
    'test_support::',
    # Only compiled under `--cfg lain_loom`; checked by `make loom`, not here.
    'src/sync\.rs.*Mutex<T>::lock',
    # Rolling an existing-file collision on a UUID v4 nonce: unreachable.
    'AlreadyExists.* in try_lock_once_guarded',
    'ErrorKind::AlreadyExists with .* in try_lock_once_guarded',
    'presence_lock\.rs:349.*in try_lock_once_guarded',
    # remove_file racing a concurrent remover between the exists() check and the
    # unlink: needs an interleaving a sequential test cannot produce.
    'NotFound with (true|false) in release_lock_if_holder_matches',
    'presence_lock\.rs:596.*release_lock_if_holder_matches',
    # Equality at an exact timestamp boundary (`>` vs `>=` on a Duration compared
    # against a wall-clock reading): not observable without controlling the clock.
    'presence_lock\.rs.*replace > with >= in (try_lock_once_guarded|AcquireGuard::take|current_holder)',
    # Retry bound off-by-one (`>=` vs `<`): the 2nd attempt is a re-scan with no
    # observable difference but timing.
    'presence_lock\.rs.*replace >= with < in try_lock$',
    # The mtime read-back drift guard: `set_modified(now)` then reading it back
    # differs by far less than the TTL, so `>` vs `>=`/`==` cannot be told apart.
    'presence_lock\.rs:666.*in FileLock::refresh_lock',
    # Directory fsync after creating the WAL: protects against power loss only,
    # not observable from a test.
    'wal\.rs.*replace sync_parent_dir with',
    # `created` only decides whether to fsync the parent directory (power-loss
    # durability) and Drop's final fsync: neither is observable without a crash.
    'wal\.rs:18[79].*delete ! in WalWriter::append',
    # read_exact on a regular file fails only with UnexpectedEof; another kind
    # cannot be produced by a test.
    'wal\.rs.*UnexpectedEof with true in replay_inner',
    # Same wall-clock boundary as the presence lock guard.
    'socket_server\.rs:97.*replace > with >= in StartGuard::take',
    # `recursive(true)` create of an existing directory is a no-op.
    'socket_server\.rs:137.*replace && with \|\| in bind_exclusive',
    # Only changes WHEN the idle check wakes (within the documented 1-2 windows).
    'socket_server\.rs:235.*replace == with != in accept_loop',
    # A file entry has agents iff it has symbols (a file-level claim records the
    # `__file_level__` scope), so `&&` and `||` agree.
    'presence\.rs.*replace && with \|\| in OccupancyMap::release',
    # `now < claimed_at` vs `<=`: equality of two wall-clock readings.
    'presence\.rs:1690.*replace < with <= in OccupancyMap::expire_by_ttl',
    # The retain predicate's `&&` vs `||`: rows `||` would additionally drop are
    # dropped by their own to_drop entry in the same pass.
    'presence\.rs:17(35|41).*replace && with \|\| in OccupancyMap::expire_by_ttl',
    # `on_disk > good_end` vs `>=`: equal lengths make set_len a no-op.
    'wal\.rs:355.*replace > with >= in replay_inner',
    # Drop's final fsync is power-loss durability only — unobservable without a
    # crash (same class as the `created` guard above).
    'wal\.rs.*replace <impl Drop for WalWriter>::drop with',
    # Nested function spans: a child's end/start is never larger than its
    # parent's, so `-` vs `/` picks the same innermost span. Equal spans tie
    # and the first in walk order wins under both.
    'field_access_sensor\.rs.*replace - with / in innermost_function_at',
    # With the parse cache disabled the lookup has no slot, so negating the
    # enabled check takes the same path and returns the same tree.
    'parse_cache\.rs.*delete ! in get_or_parse',
    # heap.rs: the test process runs on glibc with LAIN_HEAP_TRIM unset, so
    # `enabled()` and `supported()` are already true, and `!enabled() ||
    # !supported()` (the early return) is false either way round.
    'heap\.rs.*replace (enabled|supported) -> bool with true',
    'heap\.rs.*replace \|\| with && in trim$',
    'heap\.rs:\d+:19: replace \|\| with && in trim_if_idle_due',
    # mem_probe.rs: the probe is off in the test process (LAIN_MEM_PROBE and
    # LAIN_MEM_PROBE_COLLECT unset), so these wrappers return what the mutant
    # returns; flag parsing (`flag_on`) and the work (`sample_and_reset`)
    # are tested directly.
    'mem_probe\.rs.*replace enabled -> bool with false',
    'mem_probe\.rs.*replace collect_enabled -> bool with (true|false)',
    'mem_probe\.rs.*replace phase -> Option<Sample> with None',
    # A live /proc read that changes between two reads; the parser
    # (`status_field_kb`) is tested on fixed text.
    'mem_probe\.rs.*replace swap_kb -> u64 with (0|1)',
    # Probe-only logging (LAIN_MEM_PROBE=1): the histogram itself is
    # `cross_repo_edge_histogram`, tested; the Drop impl only logs.
    'manager\.rs.*replace log_cross_repo_edge_histogram with \(\)',
    'manager\.rs.*replace <impl Drop for SnapshotFederation>::drop with \(\)',
    # `evict_idle_residents(..) > 0` only decides whether the probe logs; the
    # eviction itself happens in the call either way.
    'manager\.rs.*replace > with (==|<|>=) in snapshot_worker_loop',
    # jobs.rs sweep: `!= SweepReport::default()` only decides whether to log.
    # `worktree_remove(..).is_err() || path.exists()`: git either removes the
    # directory (is_err false, path gone) or fails (is_err true, path still
    # there), so `&&` and `||` take the same branch.
    'jobs\.rs.*replace != with == in sweep_orphaned_job_state_in',
    'jobs\.rs.*replace \|\| with && in sweep_orphaned_job_state_in',
]
