[workspace]
members = ["."]

[package]
name = "lain"
version = "0.7.4"
edition = "2021"
description = "Lain - Structural code intelligence for AI agents"
authors = ["spuentesp"]
license = "MIT"

[dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full"] }
# CancellationToken for cooperative indexing and shutdown.
# The `rt` feature is what exports `tokio_util::sync::CancellationToken`.
tokio-util = { version = "0.7", features = ["rt"] }

# MCP Server (Model Context Protocol)
rust-mcp-sdk = { version = "=1.1.0", default-features = false, features = ["server", "stdio", "macros"] }
rust-mcp-schema = { version = "=1.0.0", default-features = false, features = ["2025_11_25", "schema_utils"] }

# HTTP server for diagnostics UI
hyper = { version = "1.9", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body = "1.0"
http-body-util = "0.1"

# Async trait for MCP server handlers
async-trait = "0.1"

# Git integration
git2 = "0.21"

# File watching
notify = "6"

# In-memory graph for volatile overlay
petgraph = { version = "0.6", features = ["serde-1"] }
# Data-level parallelism
rayon = "1.10"

# Persistence
bincode = { version = "2", features = ["serde"] }

# NLP & Machine Learning
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
# Disable tokenizers' default `esaxx_fast` feature, which pulls in
# `esaxx-rs`'s `cc`-built C++ as a static `/MT` archive. That collides
# at link time on Windows with `ort-sys`'s prebuilt `/MD` C++ runtime
# (fatal LNK1169 / LNK2038 mismatch on `RuntimeLibrary`). The pure-Rust
# suffix-array fallback that ships in the same crate is used instead.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# LSP bridge for multi-language support
lsp-bridge = "0.2"
lsp-types = "0.97"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Hashing
blake3 = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI argument parsing
clap = { version = "4.4", features = ["derive", "env"] }

# Path handling
walkdir = "2.4"
glob = "0.3"
dunce = "1.0"

# Tree-sitter static analysis
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }

# Regex for pattern matching
regex = "1.10"
ignore = "0.4"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"

# Once cell for static initialization
once_cell = "1.19"
inventory = "0.2"

# Directory management
dirs = "5.0"
parking_lot = "0.12.5"
which = "8.0.2"

# Concurrency primitives
dashmap = "6.0"
async-recursion = "1.1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# Bounded LRU cache for the embedding hot path (B1). Pure data-structure
# crate, no I/O or network transitive deps — same shape as `dashmap`
# above, which is already vendored-class common in this repo.
lru = "0.12"

# Tree-sitter static analysis
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-scala = "0.26"
tree-sitter-php = "0.24"

# Per-repo annotation storage (M4 plan §4.2: per-repo sqlite table
# for agent-side comment + handoff layer). `bundled` keeps the
# sqlite C source in the crate so we don't depend on a host-
# installed libsqlite3; CI runners, brew users, and Windows
# contributors all get the same code path.
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.8"
proptest = { version = "1.5", features = ["std"] }
inventory = "0.2"

[lib]
name = "lain"
path = "src/lib.rs"

[[bin]]
name = "lain"
path = "src/main.rs"

# Git isolation sidecar shipped alongside the main binary. Keeping the daemon
# in the same package pins its protocol and release version to `lain`.
[[bin]]
name = "lain-git-sidecar"
path = "src/bin/lain-git-sidecar.rs"

[[bin]]
name = "sidecar_bench"
path = "src/bin/sidecar_bench.rs"

[features]
# No features defined yet. (The `test-utils` feature was removed in
# the docs/dead-code sweep — the only thing it gated was a
# `PetgraphBackend::db()` helper that no test actually used.)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
