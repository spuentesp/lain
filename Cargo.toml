[package]
name = "lain"
version = "0.1.0"
edition = "2021"
description = "Language-Augmented Ingestion Network - Architectural brain for AI agents"
authors = ["spuentesp"]
license = "MIT"

[dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full"] }

# MCP Server (Model Context Protocol)
rmcp = { version = "0.5", features = ["server", "transport-io"] }

# Git integration
git2 = "0.19"

# Graph database
kuzu = "0.11.3"

# In-memory graph for volatile overlay
petgraph = "0.6"

# LSP bridge for multi-language support
lsp-bridge = "0.2"
lsp-types = "0.97"

# ONNX Runtime for local NLP embeddings
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }

# HuggingFace tokenizers for BERT-compatible tokenization
tokenizers = "0.22"

# Array tensors for ONNX
ndarray = "0.17"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Async traits
async-trait = "0.1"

# Async channels
flume = "0.11"

# Path handling
walkdir = "2.4"
glob = "0.3"

# Process management
portable-pty = "0.8"

# UUID for node identifiers
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }

# Once cell for static initialization
once_cell = "1.19"

# Directory management
dirs = "5.0"
parking_lot = "0.12.5"
which = "8.0.2"
async-recursion = "1.1.1"

[dev-dependencies]
tempfile = "3.8"

[build-dependencies]

[features]
default = []

[[bin]]
name = "lain"
path = "src/main.rs"

[lib]
name = "lain"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
