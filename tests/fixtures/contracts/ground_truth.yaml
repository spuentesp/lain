              class: NeedsInvestigation
              reasons: [reads_not_fully_traced]
        - side: provider
          endpoint: { service: orders, key: "http:GET /api/orders/me" }
          kind: FieldRemoved
          direction: response
          field: customer_id
          compat: BreakingIfRead
          impact:
            class: NeedsInvestigation
            reasons: [reads_not_fully_traced]
          affected:
            - service: billing
              class: NeedsInvestigation
              reasons: [reads_not_fully_traced]
        - side: provider
          endpoint: { service: orders, key: "http:POST /api/orders" }
          kind: FieldRemoved
          direction: response
          field: customer_id
          compat: BreakingIfRead
          impact:
            class: NeedsInvestigation
            reasons: [reads_not_fully_traced]
          affected:
            - service: billing
              class: NeedsInvestigation
              reasons: [reads_not_fully_traced]
