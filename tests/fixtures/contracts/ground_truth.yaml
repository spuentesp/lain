  "15":
    title: "Lines inserted above a confirmed binding's call site"
    setup:
      # Bind billing's `fetch_order` to orders /api/orders/{} via
      # `bindings:`, then insert blank lines (or comments) above the
      # call site in src/main.py — the line number changes but the
      # SymbolKey-based matching does not (§4.6 / §7.6).
      base:  { orders: base, billing: <sha with confirmed binding> }
      head:  { orders: base, billing: <sha with lines inserted above fetch_order> }
      bindings_unchanged: true
    tool: prepare_snapshot + get_coverage
    expected:
      # The binding still resolves; no `stale_bindings`.
      coverage:
        stale_bindings: []
      bound_consumers:
