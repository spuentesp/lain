  "12":
    title: "Same rename with a type change"
    setup:
      base:  { orders: base,  billing: base }
      head:  { orders: s12-rename-retype, billing: base }
    tool: diff_contracts
    expected:
      changes:
        - side: provider
          endpoint: { service: orders, key: "http:GET /api/orders/{}" }
          kind: FieldRemoved
          direction: response
