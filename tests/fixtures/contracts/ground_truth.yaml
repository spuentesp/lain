              reasons: []
        - side: provider
          endpoint: { service: orders, key: "http:POST /api/orders" }
          kind: FieldAdded
          direction: response
          field: customerId
          type: integer
          required: true
          compat: BreakingIfRead
          impact:
            class: Verified
            reasons: []
          affected:
            - service: billing
              class: Verified
              reasons: []

  "13":
    title: "billing calls literal /api/orders/me"
    setup:
      snapshot: { orders: base, billing: base }
    tool: list_unresolved
    expected:
      bind:
        consumer: { service: billing, repo: billing, file: src/main.py, symbol: fetch_me }
        endpoint: { service: orders, key: "http:GET /api/orders/me" }   # not /api/orders/{}
        match: exact
        provenance: { kind: static, confidence: 1.0 }
      # And there is no Binds between this consumer and
      # /api/orders/{} — the literal path is more specific than the
      # parameterised one (§7.4 specificity).

  "14":
    title: "billing calls api.stripe.com"
    setup:
      snapshot: { orders: base, billing: base }
    tool: get_coverage
    expected:
      coverage:
        external:
          - { host: api.stripe.com, calls: 1 }
        unresolved_consumers: []    # NOT in unresolved list — rule 4
        schemaless_endpoints: []
