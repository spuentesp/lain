          field: customer_id
          compat: BreakingIfRead
          impact:
            class: Verified
            reasons: []
          affected:
            - service: billing
              class: Verified
              reasons: []
        - side: provider
          endpoint: { service: orders, key: "http:GET /api/orders/{}" }
          kind: FieldAdded
          direction: response
          field: customerId
          type: integer
          required: true
          compat: BreakingIfRead
          impact:
            class: Verified
            reasons: []
          affected:
            - service: billing
              class: Verified
              reasons: []
        - side: provider
          endpoint: { service: orders, key: "http:GET /api/orders/me" }
          kind: FieldAdded
          direction: response
          field: customerId
          type: integer
          required: true
          compat: BreakingIfRead
          impact:
            class: Verified
            reasons: []
          affected:
