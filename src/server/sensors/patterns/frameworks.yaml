# Bundled Camp-A pattern registry for `src/server/sensors/`.
#
# Each entry is one framework the contract-federation sensors know
# about. The walker in `http_sensor.rs` (regex-based) and
# `http_client_sensor.rs` (tree-sitter-based) consume the per-lang
# entries via `Patterns::route_patterns(lang)` /
# `Patterns::outbound_patterns(lang)` /
# `Patterns::deny_methods_for(lang, lib)`.
#
# Adding a new framework is a data change: append one entry here and
# (for tree-sitter shapes) a matching `<lang>/<framework>.scm` file.
# Tasks 2-4 wire the consumers to read this data instead of the
# hardcoded tables in the sensors' source.
#
# Source-of-truth mappings (today's code, future-proofed as data):
#   - Route regex strings: `http_sensor.rs::get_route_patterns`
#     (lines 182-366).
#   - Outbound `lib_match` regexes + `deny_methods`: per-language
#     `detect_<lang>_call` in `http_client_sensor.rs`.
#
# BTreeMap iteration order follows YAML load order. Override files in
# `<repo>/.lain/patterns/*.yaml` REPLACE entries with matching `id`.

languages:

  # ── Python ───────────────────────────────────────────────────────
  python:
    - id: fastapi-route
      kind: route
      verbs: [get, post, put, delete, patch, head, options]
      path_regex: '@[\w\.]+\.(?:get|post|put|delete|patch|head|options)\s*\(\s*["'']([^"'']+)["'']'
      handler_regex: '(?:async\s+)?def\s+(\w+)\s*\('
    - id: flask-route
      kind: route
      verbs: [get, post, put, delete, patch, head, options]
      path_regex: '@[\w\.]+\.route\s*\(\s*["'']([^"'']+)["'']'
      handler_regex: 'def\s+(\w+)\s*\('
    - id: requests-outbound
      kind: outbound
      lib_match: '^requests$'
      deny_methods: [json, text, data, body, content, encoding, raise_for_status, status_code, headers, url, ok, elapsed, is_redirect]
    - id: httpx-outbound
      kind: outbound
      lib_match: '^httpx$'
      deny_methods: [json, text, data, body, content, encoding, raise_for_status, status_code, headers, url, ok, elapsed, is_redirect]
    - id: aiohttp-outbound
      kind: outbound
      lib_match: '^aiohttp$'
    # Task 8 (data-driven sensor-patterns proof): Django's
    # `path("foo/", handler)` / `re_path(r"^bar/$", handler)`
    # constructor — a non-decorator route shape that's
    # tree-sitter distinct from `fastapi-route` / `flask-route`
    # (matches a `path` or `re_path` identifier function with a
    # string literal + positional handler identifier). Pure data
    # change: this YAML entry + the matching
    # `python/django-route.scm`. No production code in
    # `src/server/sensors/*.rs` is touched.
    - id: django-route
      kind: route
      verbs: [get, post, put, delete, patch, head, options]
      path_regex: '\b(?:path|re_path)\s*\(\s*r?["'']([^"'']+)["'']'
      handler_regex: '\b(?:path|re_path)\s*\(\s*r?["''][^"'']+["'']\s*,\s*(\w+)'
    # Tier 1 (Task 8): kafkajs / aiokafka / Celery idioms. The
    # walker consumes these via `topic_producer_patterns` /
    # `topic_consumer_patterns` / `scheduled_patterns`. Capture
    # group 1 is the topic name (or `celery:task` sentinel for
    # `@app.task` / `@shared_task`).
    - id: aiokafka-producer
      kind: topic_producer
      path_regex: '\b(?:AIOKafkaProducer|KafkaProducer)\s*\(\s*["'']([^"'']+)["'']'
    - id: aiokafka-consumer
      kind: topic_consumer
      path_regex: '\b(?:AIOKafkaConsumer|KafkaConsumer)\s*\(\s*["'']([^"'']+)["'']'
    - id: confluent-kafka-consumer
      kind: topic_consumer
      # confluent_kafka Python: `consumer.subscribe(["topic"])` —
      # the literal topic list (the `Consumer({...})` ctor carries
      # config only, never a topic). Group 1: string-literal topic
      # name.
      path_regex: '\.subscribe\s*\(\s*\[\s*["'']([^"'']+)["'']'
    - id: aiohttp-send
      kind: topic_producer
      # `.send_and_wait(...)` / `.send(...)` with first string
      # arg. Group 1: string literal. Group 2: bare identifier
      # (resolved against same-file constants).
      path_regex: '(?:\.send_and_wait|\.send)\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: aiohttp-send-kwarg
      kind: topic_producer
      # `.send(topic="…", …)` / `.send_and_wait(topic="…", …)`.
      # Group 1: literal. Group 2: bare identifier.
      path_regex: '(?:\.send_and_wait|\.send)\s*\(\s*[^)]*?topic\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: celery-task
      kind: scheduled
      # `@app.task` / `@shared_task` — the walker performs a
      # same-file lookahead for the next `def` line; the spec is a
      # stable sentinel because Celery doesn't pass a spec string.
      path_regex: '^@(?:\w+\.)?task\b|^@shared_task\b'
    # Task 2: pika (Python AMQP) idioms. The walker consumes these
    # via `topic_producer_patterns` / `topic_consumer_patterns`; the
    # event sensor derives broker "amqp" from the `pika*` framework
    # id, so these mint `amqp/<queue>` topics instead of `kafka/…`.
    # Group 1: string-literal queue/routing-key name. Group 2: bare
    # identifier (resolved against same-file constants).
    - id: pika-publish
      kind: topic_producer
      broker: amqp
      path_regex: '\.basic_publish\s*\([^)]*?routing_key\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: pika-consume
      kind: topic_consumer
      broker: amqp
      path_regex: '\.basic_consume\s*\([^)]*?queue\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: pika-queue-declare
      kind: topic_producer
      broker: amqp
      path_regex: '\.queue_declare\s*\([^)]*?queue\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: pika-queue-bind
      kind: topic_consumer
      broker: amqp
      # `channel.queue_bind(queue=..., exchange=..., routing_key=...)`
      # declares the repo's use of the queue — the acceptance
      # fixtures' ONLY AMQP consumer idiom (no basic_consume /
      # basic_publish / queue_declare anywhere). Queue is the `queue`
      # kwarg. Group 1: string literal. Group 2: bare identifier.
      path_regex: '\.queue_bind\s*\([^)]*?queue\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'

  # ── TypeScript / JavaScript ─────────────────────────────────────
    - id: redis-publish
      kind: topic_producer
      broker: redis
      path_regex: '\b(?:redis\w*|r|cache)\.publish\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: redis-subscribe
      kind: topic_consumer
      broker: redis
      path_regex: '\b(?:pubsub|redis\w*|r)\.(?:subscribe|psubscribe)\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: redis-xadd
      kind: topic_producer
      broker: redis
      path_regex: '\b(?:redis\w*|r)\.xadd\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: mqtt-publish
      kind: topic_producer
      broker: mqtt
      path_regex: '\b(?:mqtt\w*|client)\.publish\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: mqtt-subscribe
      kind: topic_consumer
      broker: mqtt
      path_regex: '\b(?:mqtt\w*|client)\.subscribe\s*\(\s*\[?\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: sqs-send
      kind: topic_producer
      broker: sqs
      path_regex: '\.send_message\s*\([^)]*?QueueUrl\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: sqs-receive
      kind: topic_consumer
      broker: sqs
      path_regex: '\.receive_message\s*\([^)]*?QueueUrl\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: sns-publish
      kind: topic_producer
      broker: sns
      path_regex: '\.publish\s*\([^)]*?TopicArn\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: sns-subscribe
      kind: topic_consumer
      broker: sns
      path_regex: '\.subscribe\s*\([^)]*?TopicArn\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: nats-publish
      kind: topic_producer
      broker: nats
      path_regex: '\b(?:nc|nats\w*)\.publish\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: nats-subscribe
      kind: topic_consumer
      broker: nats
      path_regex: '\b(?:nc|nats\w*)\.subscribe\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: kinesis-put-record
      kind: topic_producer
      broker: kinesis
      path_regex: '\.put_record\s*\([^)]*?StreamName\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: kinesis-get-shard-iterator
      kind: topic_consumer
      broker: kinesis
      path_regex: '\.get_shard_iterator\s*\([^)]*?StreamName\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: eventbridge-put-events
      kind: topic_producer
      broker: eventbridge
      path_regex: '\.put_events\s*\([^)]*?EventBusName["'']?\s*[:=]\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: pulsar-create-producer
      kind: topic_producer
      broker: pulsar
      path_regex: '\.create_producer\s*\(\s*(?:topic\s*=\s*)?(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: pulsar-subscribe
      kind: topic_consumer
      broker: pulsar
      path_regex: '\.subscribe\s*\(\s*(?:topic\s*=\s*)?(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))\s*,\s*subscription_name'
    - id: pubsub-topic-path
      kind: topic_producer
      broker: pubsub
      path_regex: '\.topic_path\s*\(\s*["''][^"'']*["'']\s*,\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: temporal-worker
      kind: topic_consumer
      broker: temporal
      path_regex: '\bWorker\s*\([^)]*?task_queue\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: temporal-start-workflow
      kind: topic_producer
      broker: temporal
      path_regex: '\.start_workflow\s*\([^)]*?task_queue\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: dramatiq-actor
      kind: topic_consumer
      broker: dramatiq
      path_regex: '@dramatiq\.actor\s*\([^)]*?queue_name\s*=\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: kafka-python-consumer
      kind: topic_consumer
      broker: kafka
      path_regex: '\bKafkaConsumer\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: kafka-python-producer
      kind: topic_producer
      broker: kafka
      path_regex: '\bproducer\.send\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: huey-instance
      kind: topic_consumer
      broker: huey
      path_regex: '\b(?:Redis|Sqlite|File|Mini)?Huey\s*\(\s*(?:name\s*=\s*)?(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: redis-xreadgroup
      kind: topic_consumer
      broker: redis
      path_regex: '\.xreadgroup\s*\([^)]*?\{\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: rq-queue
      kind: topic_consumer
      broker: rq
      path_regex: '\b(?:rq\.)?Queue\s*\(\s*(?:name\s*=\s*)?(?:["'']([^"'']+)["''])'
  tsjs:
    - id: express-route
      kind: route
      verbs: [get, post, put, delete, patch, head, options]
      path_regex: '\.(?:get|post|put|delete|patch|head|options)\s*\(\s*["''`]([^"''`]+)["''`]'
      handler_regex: '\.(?:get|post|put|delete|patch|head|options)\s*\(\s*["''`][^"''`]+["''`]\s*,\s*(?:async\s*)?(\w+)'
    - id: fastify-route
      kind: route
      verbs: [get, post, put, delete, patch, head, options]
      path_regex: '\.(?:get|post|put|delete|patch|head|options)\s*\(\s*["''`]([^"''`]+)["''`]'
      handler_regex: '\.(?:get|post|put|delete|patch|head|options)\s*\(\s*["''`][^"''`]+["''`]\s*,\s*(?:async\s*)?(\w+)'
    - id: fetch-outbound
      kind: outbound
      lib_match: '^(fetch|globalThis\.fetch)$'
      deny_methods: [json, text, blob, arrayBuffer, formData, status, redirected, headers, ok, url]
    - id: axios-outbound
      kind: outbound
      lib_match: '^axios$'
      deny_methods: [json, text, data, body, status, statusText, headers, config]
    - id: got-outbound
      kind: outbound
      lib_match: '^(got|ky)$'
    # Tier 1 (Task 8): kafkajs / confluent-kafka produce /
    # consume / NestJS `@Cron` scheduled sites. The walker
    # consumes these via `topic_producer_patterns` /
    # `topic_consumer_patterns` / `scheduled_patterns`. Capture
    # group 1 is the topic name (or the cron spec).
    - id: kafkajs-producer
      kind: topic_producer
      # Group 1: string-literal topic name. Group 2: bare
      # identifier (resolved against same-file constants by the
      # event_sensor). Either form yields a match.
      path_regex: '\.send\s*\(\s*\{[^}]*?topic\s*:\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: kafkajs-consumer
      kind: topic_consumer
      # Group 1: string-literal topic name in the topics array.
      path_regex: '\.(?:run|subscribe)\s*\(\s*\{[^}]*?topics?\s*:\s*\[\s*["'']([^"'']+)["'']'
    # Task 2: amqplib (Node AMQP) idioms. The event sensor derives
    # broker "amqp" from the `amqplib*` framework id, so these mint
    # `amqp/<queue>` topics instead of `kafka/…`.
    - id: amqplib-publish
      kind: topic_producer
      broker: amqp
      # amqplib `channel.publish(exchange, routingKey, content, …)` —
      # the routing key is argument 2. The trailing `\s*,` requires
      # the mandatory content argument, keeping unrelated two-argument
      # `res.publish(a, b)` calls from minting a bus topic. Group 1:
      # string literal. Group 2: bare identifier.
      path_regex: '\.publish\s*\([^,]+,\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))\s*,'
    - id: amqplib-consume
      kind: topic_consumer
      broker: amqp
      # amqplib `channel.consume(queue, onMessage, …)` — the queue is
      # argument 1; argument 2 is the callback and is never a queue
      # name. Group 1: string literal. Group 2: bare identifier.
      path_regex: '\.consume\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: amqplib-queue-declare
      kind: topic_producer
      broker: amqp
      # amqplib `channel.assertQueue(queue, options)` — the queue is
      # argument 1 (the queue.declare sibling of pika's queue_declare).
      path_regex: '\.assertQueue\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: amqplib-queue-bind
      kind: topic_consumer
      broker: amqp
      # amqplib `channel.bindQueue(queue, source, pattern, args)` —
      # binding the queue declares the repo's use of it (the sibling
      # of pika's queue_bind); the queue is argument 1.
      path_regex: '\.bindQueue\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: nestjs-cron
      kind: scheduled
      path_regex: '@Cron\s*\(\s*["'']([^"'']+)["'']'
    # Tier 1 (Task 8): WebSocket idioms. The walker in
    # `src/server/sensors/util.rs::walk_websocket_idioms` consumes
    # these through the `*_all` accessors (the pre-Tier-1
    # websocket_sensor applied the same URL regexes to every
    # line of every source file regardless of language).
    - id: ws-url-literal
      kind: websocket_client
      path_regex: '["''](wss?://[^"'']+)["'']'
    - id: ws-ctor
      kind: websocket_client
      path_regex: 'new\s+WebSocket\s*\(\s*["'']([^"'']+)["'']'
    - id: ws-server-route
      kind: websocket_server
      path_regex: '(?:app\.ws|router\.ws|WebSocketGateway)\s*\(\s*["'']([^"'']+)["'']'
    - id: ws-event-handler
      kind: websocket_handler
      # Group 1 is the event name; group 2 is the handler. The
      # walker captures group 2 — keeping group 1 in the regex
      # lets the alternation match the four `on{…}` shapes in a
      # single non-optional branch.
      path_regex: '(on(?:open|message|close|error))\s*[=:]\s*(\w+)'

  # ── Rust ─────────────────────────────────────────────────────────
    - id: ioredis-publish
      kind: topic_producer
      broker: redis
      path_regex: '\b(?:redis\w*|ioredis|pub)\.publish\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: ioredis-subscribe
      kind: topic_consumer
      broker: redis
      path_regex: '\b(?:redis\w*|ioredis|sub)\.(?:subscribe|psubscribe)\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: mqtt-js-publish
      kind: topic_producer
      broker: mqtt
      path_regex: '\b(?:mqtt\w*|client)\.publish\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: mqtt-js-subscribe
      kind: topic_consumer
      broker: mqtt
      path_regex: '\b(?:mqtt\w*|client)\.subscribe\s*\(\s*\[?\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: sqs-v3-send
      kind: topic_producer
      broker: sqs
      path_regex: 'SendMessageCommand\s*\(\s*\{[^}]*?QueueUrl\s*:\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: sqs-v3-receive
      kind: topic_consumer
      broker: sqs
      path_regex: 'ReceiveMessageCommand\s*\(\s*\{[^}]*?QueueUrl\s*:\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: sns-v3-publish
      kind: topic_producer
      broker: sns
      path_regex: 'PublishCommand\s*\(\s*\{[^}]*?TopicArn\s*:\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: sns-v3-subscribe
      kind: topic_consumer
      broker: sns
      path_regex: 'SubscribeCommand\s*\(\s*\{[^}]*?TopicArn\s*:\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: nats-js-publish
      kind: topic_producer
      broker: nats
      path_regex: '\b(?:nc|nats\w*)\.publish\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: nats-js-subscribe
      kind: topic_consumer
      broker: nats
      path_regex: '\b(?:nc|nats\w*)\.subscribe\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: eventbridge-v3-put-events
      kind: topic_producer
      broker: eventbridge
      path_regex: 'PutEventsCommand\s*\(\s*\{[^}]*?EventBusName\s*:\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: kinesis-v3-put-record
      kind: topic_producer
      broker: kinesis
      path_regex: 'PutRecordCommand\s*\(\s*\{[^}]*?StreamName\s*:\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: pubsub-js-topic
      kind: topic_producer
      broker: pubsub
      path_regex: '\.topic\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))\s*\)\s*\.publishMessage'
    - id: inngest-send
      kind: topic_producer
      broker: inngest
      path_regex: '\binngest\.send\s*\(\s*\{[^}]*?name\s*:\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: inngest-trigger
      kind: topic_consumer
      broker: inngest
      path_regex: 'triggers\s*:\s*\[\s*\{\s*event\s*:\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: ioredis-xadd
      kind: topic_producer
      broker: redis
      path_regex: '\.xadd\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: ioredis-xreadgroup
      kind: topic_consumer
      broker: redis
      path_regex: '\.xreadgroup\s*\([^)]*?STREAMS''?\s*,\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: bullmq-queue
      kind: topic_producer
      broker: bullmq
      path_regex: '\bnew\s+Queue\s*\(\s*(?:["'']([^"'']+)["''])'
    - id: bullmq-worker
      kind: topic_consumer
      broker: bullmq
      path_regex: '\bnew\s+Worker\s*\(\s*(?:["'']([^"'']+)["''])'
    - id: bull-queue
      kind: topic_producer
      broker: bull
      path_regex: '\bnew\s+Bull\s*\(\s*(?:["'']([^"'']+)["''])'
  rust:
    - id: axum-route
      kind: route
      verbs: [get, post, put, delete, patch, head, options]
      path_regex: '\.route\s*\(\s*"([^"]+)"'
      handler_regex: '(?i:(?:get|post|put|delete|patch|head|options))\s*\(\s*(\w+)\s*[,)]'
    - id: actix-route
      kind: route
      verbs: [get, post, put, delete, patch, head, options]
      path_regex: '#\[(?i:(?:get|post|put|delete|patch|head|options))\s*\(\s*(?:path\s*=\s*)?"([^"]+)"'
      handler_regex: '(?:async\s+)?fn\s+(\w+)\s*[(<]'
    - id: reqwest-outbound
      kind: outbound
      lib_match: '^(reqwest|.*reqwest::Client.*|ureq.*)$'
      deny_methods: [json, text, bytes, status, headers, url, error_for_status]
    - id: ureq-outbound
      kind: outbound
      lib_match: '^ureq$'
      deny_methods: [json, text, bytes, status, headers, url, error_for_status]
    - id: awc-outbound
      kind: outbound
      lib_match: '^awc$'
    # Tier 1 (Task 8): rdkafka produce / consume idioms. Capture
    # group 1 is the topic name.
    - id: rdkafka-producer
      kind: topic_producer
      # Group 1: string literal. Group 2: bare identifier.
      path_regex: 'FutureRecord::to\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: rdkafka-send
      kind: topic_producer
      # rdkafka `producer.send(record, …)` — the topic name
      # appears as a string literal (or bare identifier) in the
      # `FutureRecord` struct's `topic` field. Group 1: literal.
      # Group 2: identifier.
      path_regex: '(?:::|\.)send\s*\(\s*[^)]*?topic\s*:\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: rdkafka-consumer
      kind: topic_consumer
      path_regex: '(?:::|\.)subscribe\s*\(\s*&\[\s*["'']([^"'']+)["'']'

  # ── Go ───────────────────────────────────────────────────────────
  go:
    - id: stdlib-http-route
      kind: route
      verbs: [any]
      path_regex: 'HandleFunc\s*\(\s*"([^"]+)"'
      handler_regex: 'HandleFunc\s*\(\s*"[^"]+"\s*,\s*(\w+)'
    - id: gin-route
      kind: route
      verbs: [GET, POST, PUT, DELETE, PATCH, OPTIONS, HEAD]
      path_regex: '\.(?:GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)\s*\(\s*"([^"]+)"'
      handler_regex: '\.(?:GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)\s*\(\s*"[^"]+"\s*,\s*(\w+)'
    - id: stdlib-http-outbound
      kind: outbound
      lib_match: '^http$'
      deny_methods: [decode, Decode, Close, Body, StatusCode, Status, Header, Proto, Request, TLS, Trailer, ContentLength]
    # Tier 1 (Task 8): kafka-go produce / consume idioms. Capture
    # group 1 is the topic name.
    - id: kafka-go-producer
      kind: topic_producer
      # Group 1: string literal. Group 2: bare identifier.
      # The `[\s\S]*?` non-greedy "any character including newlines
      # and parens" handles the `&kafka.Message{Topic: "...",
      # Value: []byte("x")}` shape — the `Topic:` field is not
      # guaranteed to be the first `{…}` block, and the `)`
      # from `[]byte(...)` would close a `[^)]*` class too early.
      # The `s?` after `SendMessage` matches the segmentio/kafka-go
      # `SendMessages` (plural) sibling.
      path_regex: '(?:SendMessages?|WriteMessages)\s*\([\s\S]*?Topic\s*:\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: kafka-go-consumer
      kind: topic_consumer
      path_regex: 'SubscribeTopics\s*\(\s*["'']([^"'']+)["'']'

  # ── Java ─────────────────────────────────────────────────────────
    - id: go-redis-publish
      kind: topic_producer
      broker: redis
      path_regex: '\b(?:rdb|redis\w*|client)\.Publish\s*\(\s*\w+\s*,\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: go-redis-subscribe
      kind: topic_consumer
      broker: redis
      path_regex: '\b(?:rdb|redis\w*|client)\.Subscribe\s*\(\s*\w+\s*,\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: nats-go-publish
      kind: topic_producer
      broker: nats
      path_regex: '\b(?:nc|nats\w*)\.Publish\s*\(\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: nats-go-subscribe
      kind: topic_consumer
      broker: nats
      path_regex: '\b(?:nc|nats\w*)\.Subscribe\s*\(\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: go-redis-xadd
      kind: topic_producer
      broker: redis
      path_regex: '\bStream\s*:\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: go-redis-xreadgroup
      kind: topic_consumer
      broker: redis
      path_regex: '\bStreams\s*:\s*\[\]string\{\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: asynq-queue-option
      kind: topic_producer
      broker: asynq
      path_regex: '\basynq\.Queue\s*\(\s*"([^"]+)"'
    - id: asynq-server-queues
      kind: topic_consumer
      broker: asynq
      path_regex: '\bQueues:\s*map\[string\]int\s*\{\s*"([^"]+)"'
    - id: go-sarama-producer-topic
      kind: topic_producer
      broker: kafka
      requires: sarama
      path_regex: '^\s*Topic:\s*(?:"([^"]+)"|([A-Za-z_][\w.]*))\s*,?\s*$'
  java:
    - id: spring-route
      kind: route
      verbs: [get, post, put, delete, patch, head, options]
      annotation: '(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)\b'
      path_regex: '@(?i:(?:GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping))\s*\(\s*(?:value\s*=\s*|path\s*=\s*)?["'']([^"'']+)["'']'
      handler_regex: 'public\s+[\w<>,\s]+\s+(\w+)\s*\('
    - id: jaxrs-route
      kind: route
      verbs: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
      annotation: '@(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\b'
      path_regex: '@Path\s*\(\s*["'']([^"'']+)["'']'
      handler_regex: 'public\s+[\w<>,\s]+\s+(\w+)\s*\('
    - id: okhttp-outbound
      kind: outbound
      display_name: okhttp
      lib_match: '^(OkHttpClient|.*OkHttpClient.*|okhttp3\..*)$'
      deny_methods: [getStatusCode, statusCode, getHeaders, headers, firstValue, getMessage, message, body, code]
    - id: httpclient-outbound
      kind: outbound
      display_name: httpclient
      lib_match: '^HttpClient$'
      deny_methods: [getStatusCode, statusCode, getHeaders, headers, firstValue, getMessage, message, body, code]

  # ── C# ───────────────────────────────────────────────────────────
    - id: spring-kafka-listener
      kind: topic_consumer
      broker: kafka
      path_regex: '@KafkaListener\s*\([^)]*?topics\s*=\s*\{?\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: spring-kafka-template-send
      kind: topic_producer
      broker: kafka
      path_regex: 'kafkaTemplate\.send\s*\(\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: rabbit-convert-and-send
      kind: topic_producer
      broker: amqp
      path_regex: '\.convertAndSend\s*\(\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: rabbit-listener
      kind: topic_consumer
      broker: amqp
      path_regex: '@RabbitListener\s*\(\s*(?:queues\s*=\s*)?\{?\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: rabbit-set-queue-names
      kind: topic_consumer
      broker: amqp
      path_regex: '\.setQueueNames\s*\(\s*(?:this\.)?(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: kafka-consumer-subscribe-list-java
      kind: topic_consumer
      broker: kafka
      path_regex: '\.subscribe\s*\(\s*(?:Arrays\.asList|Collections\.singletonList|List\.of)\s*\(\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
  csharp:
    - id: aspnet-route
      kind: route
      verbs: [get, post, put, delete, head, options, patch]
      annotation: '\[(HttpGet|HttpPost|HttpPut|HttpDelete|HttpPatch|HttpHead|HttpOptions|HttpRequest)\]'
      path_regex: '\[(?i:(?:HttpGet|HttpPost|HttpPut|HttpDelete|HttpPatch|HttpHead|HttpOptions))\s*(?:\(\s*["'']([^"'']+)["'']\s*\))?'
      handler_regex: '(?:public|private|internal|async|protected)\s+[\w<>,\s\[\]?]+\s+(\w+)\s*\('
    - id: minimal-api-route
      kind: route
      verbs: [get, post, put, delete, patch]
      annotation: 'MapGet|MapPost|MapPut|MapDelete|MapPatch'
      path_regex: '\.(?:MapGet|MapPost|MapPut|MapDelete|MapPatch)\s*\(\s*["'']([^"'']+)["'']'
      handler_regex: '\.(?:MapGet|MapPost|MapPut|MapDelete|MapPatch)\s*\(\s*["''][^"'']+["'']\s*,\s*(?:async\s*)?\([^)]*\)\s*=>'
    - id: httpclient-outbound
      kind: outbound
      display_name: httpclient
      lib_match: '^(HttpClient|.*HttpClient.*|WebClient.*)$'
      deny_methods: [IsSuccessStatusCode, StatusCode, Headers, GetValues, DownloadString, DownloadStringTaskAsync]

  # ── Ruby ─────────────────────────────────────────────────────────
    - id: confluent-consumer-subscribe
      kind: topic_consumer
      broker: kafka
      path_regex: '(?i)consumer\w*\s*\.\s*Subscribe\s*\(\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: confluent-producer-produce
      kind: topic_producer
      broker: kafka
      path_regex: '(?i)producer\w*\s*\.\s*Produce(?:Async)?\s*\(\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
  ruby:
    - id: sinatra-route
      kind: route
      verbs: [get, post, put, delete, patch, head, options]
      path_regex: '(?m)^[ \t]*(?:get|post|put|delete|patch|options|head)\s+["'']([^"'']+)["'']'
      handler_regex: 'do\s*$'
    - id: rails-route
      kind: route
      verbs: [get, post, put, patch, delete, options, head]
      source: 'config/routes.rb'
      path_regex: '(?m)^[ \t]*(?:get|post|put|patch|delete|options|head)\s+["'']([^"'']+)["'']'
    - id: net-http-outbound
      kind: outbound
      lib_match: '^(Net::HTTP|HTTParty|Faraday|RestClient)$'
      deny_methods: [body, code, message, read_body, back]
    - id: httparty-outbound
      kind: outbound
      display_name: httparty
      lib_match: '^HTTParty$'
      deny_methods: [body, code, message, read_body, back]
    - id: faraday-outbound
      kind: outbound
      lib_match: '^Faraday$'
    - id: restclient-outbound
      kind: outbound
      lib_match: '^RestClient$'

  # ── Kotlin ───────────────────────────────────────────────────────
    - id: sidekiq-push
      kind: topic_producer
      broker: sidekiq
      path_regex: 'Sidekiq::Client\.push\s*\([^)]*?["'']queue["'']\s*=>\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: sidekiq-options
      kind: topic_consumer
      broker: sidekiq
      path_regex: 'sidekiq_options\s+(?:queue:\s*|["'']queue["'']\s*=>\s*)(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: resque-enqueue-to
      kind: topic_producer
      broker: resque
      path_regex: 'Resque\.enqueue_to\s*\(\s*(?:["'']([^"'']+)["'']|([A-Za-z_]\w*))'
    - id: resque-queue-ivar
      kind: topic_consumer
      broker: resque
      path_regex: '@queue\s*=\s*:(\w+)'
    - id: activejob-queue-as
      kind: topic_consumer
      broker: activejob
      path_regex: '\bqueue_as\s+:?(\w+)'
    - id: activejob-set-queue
      kind: topic_producer
      broker: activejob
      path_regex: '\bset\s*\(\s*queue:\s*(?:''|:)?(\w+)'
  kotlin:
    - id: ktor-route
      kind: route
      verbs: [get, post, put, delete, patch, head, options]
      path_regex: '(?m)(?:^|\W)(?:get|post|put|patch|delete|head|options)\s*\(\s*["'']([^"'']+)["'']'
      handler_regex: '(get|post|put|patch|delete|head|options)\s*\(\s*"[^"]+"\s*\)'
    - id: ktor-client-outbound
      kind: outbound
      display_name: ktor
      lib_match: '^(HttpClient|OkHttpClient)$'
      deny_methods: [statusCode, call, headers, body]
    - id: okhttp-outbound
      kind: outbound
      display_name: okhttp
      lib_match: '^OkHttpClient$'
      deny_methods: [statusCode, call, headers, body]
    - id: kafka-consumer-subscribe-list
      kind: topic_consumer
      broker: kafka
      path_regex: '\bsubscribe\s*\(\s*listOf\s*\(\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
    - id: kafka-record-producer
      kind: topic_producer
      broker: kafka
      path_regex: '\bProducerRecord\s*(?:<[^>]*>)?\s*\(\s*(?:"([^"]+)"|([A-Za-z_]\w*))'
