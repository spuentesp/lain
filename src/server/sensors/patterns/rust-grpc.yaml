# Replaced as a whole by <repo>/.lain/patterns/rust-grpc.yaml.
# Identity requires a qualified generated module path, never a Client suffix alone.
generated_type_pattern: '(^|::)[a-zA-Z_][a-zA-Z_0-9]*_client::[A-Z][a-zA-Z_0-9]*Client$'
constructors: [new, with_interceptor, with_origin]
async_constructors: [connect]
deny_methods: [clone, ready, send_compressed, accept_compressed, max_decoding_message_size, max_encoding_message_size, unwrap, expect, unwrap_or, unwrap_or_else, unwrap_or_default, unwrap_err, expect_err, map_err]
# Cross-file accessors are opt-in, keyed by the receiver's qualified type.
# Each entry needs receiver_type, method, return_type, provenance.
accessors: []
# Optional wrappers map an exact receiver_type + method to generated_type +
# rpc_method. Each entry requires provenance documenting the delegation.
# Configure these in the repository override, alongside the bundled settings.
# wrappers:
#   - receiver_type: openshell_core::grpc_client::CachedOpenShellClient
#     method: get_draft_policy
#     generated_type: openshell_core::proto::open_shell_client::OpenShellClient
#     rpc_method: get_draft_policy
#     provenance: grpc_client.rs delegates to generated OpenShellClient


# Catalog comparison uses both generated module and type, plus an RPC name.
client_module_template: "{service_snake}_client"
client_type_template: "{service_camel}Client"

# Live LSP definition validation. These are regexes over the compacted generated
# method body and can be replaced in a repository's rust-grpc.yaml override.
tonic_dispatch_patterns:
  - '\.unary\('
  - '\.server_streaming\('
  - '\.client_streaming\('
  - '\.streaming\('
rpc_path_pattern: 'PathAndQuery::from_static\("/(?P<service>[^/" ]+)/(?P<method>[^/" ]+)"\)'
