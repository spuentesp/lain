# Models lain can use. `lain models install` fetches the default one.
# A user file at ~/.config/lain/models.toml (same format) can add models or
# change `default`; a model there with the same name replaces this one.
#
# Each file is pinned by the repository revision and its SHA-256, so every
# install loads the same bytes and an upstream change cannot alter results.

default = "granite-embedding-small-english-r2"

