<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blast Radius</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="/theme.css">
    <script>
      // Apply the saved theme before first paint so the page never flashes the
      // wrong palette. No stored choice => fall through to prefers-color-scheme,
      // which theme.css handles on its own. The key is shared with the Command
      // Center, so a choice made there carries over to these detail views.
      try {
        var t = localStorage.getItem('lain-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* storage blocked — system preference still applies */ }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-mono);
            background: var(--bg);
            color: var(--fg);
            font-size: 13px;
            line-height: 1.5;
            padding: 20px;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-shadow: var(--glow);
        }
        .info {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 2px solid var(--accent);
            padding: 10px 15px;
            margin-bottom: 20px;
            color: var(--fg-muted);
            font-size: 0.8rem;
        }
        .instructions {
            margin-top: 15px;
            color: var(--fg-muted);
            font-size: 0.78rem;
        }
        /* Federation selector + form. */
        #repo-selector label, #query-form label {
            margin-right: 0.5rem;
            color: var(--fg-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        #repo-selector select, #query-form input {
            background: var(--surface);
            color: var(--fg);
            border: 1px solid var(--border);
            padding: 5px 8px;
            font-family: inherit;
            font-size: 0.8rem;
        }
        #repo-selector select:focus, #query-form input:focus {
            border-color: var(--accent);
            outline: none;
        }
        #query-form button {
            background: var(--accent);
            color: var(--accent-fg);
            border: 1px solid var(--accent);
            padding: 6px 14px;
            cursor: pointer;
            margin-left: 0.5rem;
            font-family: inherit;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }
        #query-form button:hover { filter: brightness(1.15); }
        #graph {
            width: 100%;
            height: 500px;
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .node { cursor: pointer; }
        .node rect { stroke: var(--border); stroke-width: 1px; }
        .node:hover rect { stroke: var(--accent); stroke-width: 2px; }
        .node-label { fill: var(--fg); font-size: 11px; font-family: var(--font-mono); }
        /* Fills come from CSS, not the `fill` attribute, so both themes work:
           a CSS rule outranks a presentation attribute. */
        .direct rect { fill: var(--sev-high-bg); stroke: var(--err); }
        .direct .node-label { fill: var(--err); }
        .indirect rect { fill: var(--surface-alt); }
        .selected rect { fill: var(--accent) !important; }
        .selected .node-label { fill: var(--accent-fg); }
        #graph line { stroke: var(--border); }
    </style>
</head>
<body class="crt-scanlines">
    <div id="repo-selector" style="display: none; margin-bottom: 1rem;">
      <label>Repo:
        <select id="repo-select"></select>
      </label>
    </div>
    <form id="query-form">
      <label>Symbol: <input name="symbol" /></label>
      <input type="hidden" name="repo_id" id="repo-id-input" />
      <button type="submit">Compute blast radius</button>
    </form>
    <h1>Blast Radius: SYMBOL_PLACEHOLDER</h1>
    <div class="info">Click nodes to mark as approved. The agent will parse your selection when you describe it.</div>
    <svg id="graph"></svg>
    <div class="instructions">Click nodes to toggle approval. Then tell the agent "I marked X as safe" or "ignore everything except Y".</div>
    <script>
        const nodes = NODES_PLACEHOLDER;
        const selected = new Set();
        const width = document.getElementById('graph').clientWidth;
        const height = 500;

        const svg = d3.select("#graph")
            .attr("viewBox", [0, 0, width, height]);

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink().id(d => d.id).distance(80))
            .force("charge", d3.forceManyBody().strength(-200))
            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = svg.append("g")
            .selectAll("line")
            .data([])
            .join("line")
            .attr("stroke-opacity", 0.6);

        const node = svg.append("g")
            .selectAll("g")
            .data(nodes)
            .join("g")
            .attr("class", d => "node " + (d.is_direct ? "direct" : "indirect"))
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("rect")
            .attr("width", 120)
            .attr("height", 40)
            .attr("x", -60)
            .attr("y", -20)
            .attr("rx", 0);

        node.append("text")
            .attr("class", "node-label")
            .attr("text-anchor", "middle")
            .attr("dy", 4)
            .text(d => d.name.length > 14 ? d.name.slice(0, 12) + ".." : d.name);

        node.on("click", function(event, d) {
            if (selected.has(d.id)) {
                selected.delete(d.id);
                d3.select(this).classed("selected", false);
            } else {
                selected.add(d.id);
                d3.select(this).classed("selected", true);
            }
            console.log("Selected:", Array.from(selected));
        });

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }
        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }
        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
    <script>
        // Federation repo selector. Hidden in single-workspace mode (when
        // /health does not return a federation blob); visible and populated
        // in federation mode. The form's hidden repo_id mirrors the selected
        // repo so submitting the form reloads the page at
        // /ui/blast-radius/?repo_id=...&symbol=... (routing this query-driven
        // URL is the responsibility of the server, not this page).
        (async function() {
            const h = await fetch('/health').then(r => r.json());
            if (!h.federation) return;  // single-workspace: hide selector
            const sel = document.getElementById('repo-select');
            for (const r of h.federation.repos) {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = `${r.id} (${r.health})`;
                sel.appendChild(opt);
            }
            // Honour the URL params if the user linked in directly.
            const params = new URLSearchParams(window.location.search);
            if (params.get('repo_id')) sel.value = params.get('repo_id');
            document.getElementById('repo-selector').style.display = 'block';
            document.getElementById('repo-id-input').value = sel.value;
            sel.addEventListener('change', () => {
                document.getElementById('repo-id-input').value = sel.value;
            });
        })();
    </script>
</body>
</html>
