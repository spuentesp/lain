<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Chain</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background: #0a0a0f; color: #e0e0e0; padding: 20px; }
        h1 { color: #00e5cc; margin-bottom: 10px; font-size: 1.2rem; }
        .info { background: #14141f; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; color: #888; }
        #diagram { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; flex-wrap: wrap; }
        .node { background: #1a1a2a; border: 1px solid #2a2a3a; border-radius: 8px; padding: 15px 20px; min-width: 120px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .node:hover { border-color: #00e5cc; transform: translateY(-2px); }
        .arrow { color: #444; font-size: 20px; }
        .instructions { margin-top: 15px; color: #666; font-size: 0.9rem; }
        .start { border-color: #00e5cc; }
        .end { border-color: #ff6b6b; }
        /* Federation selector + form — matches the page's dark theme. */
        #repo-selector label, #query-form label { margin-right: 0.5rem; color: #e0e0e0; }
        #repo-selector select, #query-form input { background: #14141f; color: #e0e0e0; border: 1px solid #2a2a3a; padding: 4px 8px; border-radius: 4px; font-family: inherit; }
        #query-form button { background: #00e5cc; color: #0a0a0f; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-left: 0.5rem; font-family: inherit; }
    </style>
</head>
<body>
    <div id="repo-selector" style="display: none; margin-bottom: 1rem;">
      <label>Repo:
        <select id="repo-select"></select>
      </label>
    </div>
    <form id="query-form">
      <label>From: <input name="from" /></label>
      <label>To: <input name="to" /></label>
      <input type="hidden" name="repo_id" id="repo-id-input" />
      <button type="submit">Compute call chain</button>
    </form>
    <h1>Call Chain: FROM_PLACEHOLDER → TO_PLACEHOLDER</h1>
    <div class="info">Click any node to see its definition. Describe your selection to the agent.</div>
    <div id="diagram"></div>
    <div class="instructions">Click nodes to explore. Tell the agent "I care about X" or "ignore Y" to update the plan.</div>
    <script>
        const path = PATH_PLACEHOLDER;
        const diagram = document.getElementById("diagram");
        const selected = new Set();

        path.forEach((name, i) => {
            const div = document.createElement("div");
            div.className = "node" + (i === 0 ? " start" : i === path.length - 1 ? " end" : "");
            div.textContent = name;
            div.onclick = () => {
                if (selected.has(name)) {
                    selected.delete(name);
                    div.style.outline = "";
                } else {
                    selected.add(name);
                    div.style.outline = "2px solid #00e5cc";
                }
                console.log("Selected:", Array.from(selected));
            };
            diagram.appendChild(div);
            if (i < path.length - 1) {
                const arrow = document.createElement("span");
                arrow.className = "arrow";
                arrow.textContent = "→";
                diagram.appendChild(arrow);
            }
        });
    </script>
    <script>
        // Federation repo selector. Hidden in single-workspace mode (when
        // /health does not return a federation blob); visible and populated
        // in federation mode. The form's hidden repo_id mirrors the selected
        // repo so submitting the form reloads the page at
        // /ui/call-chain/?repo_id=...&from=...&to=... (routing this query-driven
        // URL is the responsibility of the server, not this page).
        (async function() {
            const h = await fetch('/health').then(r => r.json());
            if (!h.federation) return;  // single-workspace: hide selector
            const sel = document.getElementById('repo-select');
            for (const r of h.federation.repos) {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = `${r.id} (${r.health})`;
                sel.appendChild(opt);
            }
            // Honour the URL params if the user linked in directly.
            const params = new URLSearchParams(window.location.search);
            if (params.get('repo_id')) sel.value = params.get('repo_id');
            document.getElementById('repo-selector').style.display = 'block';
            document.getElementById('repo-id-input').value = sel.value;
            sel.addEventListener('change', () => {
                document.getElementById('repo-id-input').value = sel.value;
            });
        })();
    </script>
</body>
</html>
