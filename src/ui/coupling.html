<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupling Heatmap</title>
    <link rel="stylesheet" href="/theme.css">
    <script>
      // Apply the saved theme before first paint so the page never flashes the
      // wrong palette. No stored choice => fall through to prefers-color-scheme,
      // which theme.css handles on its own. The key is shared with the Command
      // Center, so a choice made there carries over to these detail views.
      try {
        var t = localStorage.getItem('lain-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* storage blocked — system preference still applies */ }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-mono);
            background: var(--bg);
            color: var(--fg);
            font-size: 13px;
            line-height: 1.5;
            padding: 20px;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-shadow: var(--glow);
        }
        .info {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 2px solid var(--accent);
            padding: 10px 15px;
            margin-bottom: 20px;
            color: var(--fg-muted);
            font-size: 0.8rem;
        }
        .instructions {
            margin-top: 15px;
            color: var(--fg-muted);
            font-size: 0.78rem;
        }
        /* Federation selector + form. */
        #repo-selector label, #query-form label {
            margin-right: 0.5rem;
            color: var(--fg-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        #repo-selector select, #query-form input {
            background: var(--surface);
            color: var(--fg);
            border: 1px solid var(--border);
            padding: 5px 8px;
            font-family: inherit;
            font-size: 0.8rem;
        }
        #repo-selector select:focus, #query-form input:focus {
            border-color: var(--accent);
            outline: none;
        }
        #query-form button {
            background: var(--accent);
            color: var(--accent-fg);
            border: 1px solid var(--accent);
            padding: 6px 14px;
            cursor: pointer;
            margin-left: 0.5rem;
            font-family: inherit;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }
        #query-form button:hover { filter: brightness(1.15); }
        .cell:hover { outline: 2px solid var(--accent); }
        #matrix { display: grid; gap: 2px; padding: 20px; }
        .cell {
            width: 40px; height: 40px;
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px;
            color: var(--fg);
        }
        .header {
            color: var(--fg-muted);
            font-size: 10px;
            letter-spacing: 0.06em;
            text-align: center;
            padding: 4px;
        }
    </style>
</head>
<body class="crt-scanlines">
    <div id="repo-selector" style="display: none; margin-bottom: 1rem;">
      <label>Repo:
        <select id="repo-select"></select>
      </label>
    </div>
    <form id="query-form">
      <label>Symbol: <input name="symbol" /></label>
      <input type="hidden" name="repo_id" id="repo-id-input" />
      <button type="submit">Compute coupling heatmap</button>
    </form>
    <h1>Coupling Heatmap: SYMBOL_PLACEHOLDER</h1>
    <div class="info">Click cells to see co-change details. Describe your selection to the agent.</div>
    <div id="matrix"></div>
    <div class="instructions">Files shown co-change together in git history. Darker cells = more frequent co-changes.</div>
    <script>
        const files = FILES_PLACEHOLDER;
        const matrix = document.getElementById("matrix");
        const n = files.length;
        matrix.style.gridTemplateColumns = `60px repeat(${n}, 40px)`;

        matrix.innerHTML = '<div class="header"></div>';
        files.forEach(f => {
            matrix.innerHTML += `<div class="header">${f.slice(-8)}</div>`;
        });

        const selected = new Set();
        for (let i = 0; i < n; i++) {
            matrix.innerHTML += `<div class="header">${files[i].slice(-8)}</div>`;
            for (let j = 0; j < n; j++) {
                const intensity = Math.random();
                const stop = intensity > 0.7 ? 'var(--err)' : 'var(--accent)';
                const pct = Math.round(12 + intensity * 88);
                const color = `color-mix(in srgb, ${stop} ${pct}%, var(--surface))`;
                const idx = i * n + j;
                matrix.innerHTML += `<div class="cell" style="background:${color}" title="${files[i]} ↔ ${files[j]}" onclick="toggleSelect(${idx})"></div>`;
            }
        }

        function toggleSelect(idx) {
            if (selected.has(idx)) {
                selected.delete(idx);
            } else {
                selected.add(idx);
            }
            console.log("Selected:", Array.from(selected));
        }
    </script>
    <script>
        // Federation repo selector. Hidden in single-workspace mode (when
        // /health does not return a federation blob); visible and populated
        // in federation mode. The form's hidden repo_id mirrors the selected
        // repo so submitting the form reloads the page at
        // /ui/coupling/?repo_id=...&symbol=... (routing this query-driven
        // URL is the responsibility of the server, not this page).
        (async function() {
            const h = await fetch('/health').then(r => r.json());
            if (!h.federation) return;  // single-workspace: hide selector
            const sel = document.getElementById('repo-select');
            for (const r of h.federation.repos) {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = `${r.id} (${r.health})`;
                sel.appendChild(opt);
            }
            // Honour the URL params if the user linked in directly.
            const params = new URLSearchParams(window.location.search);
            if (params.get('repo_id')) sel.value = params.get('repo_id');
            document.getElementById('repo-selector').style.display = 'block';
            document.getElementById('repo-id-input').value = sel.value;
            sel.addEventListener('change', () => {
                document.getElementById('repo-id-input').value = sel.value;
            });
        })();
    </script>
</body>
</html>
