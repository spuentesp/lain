<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LAIN — Query Console</title>
<style>
  :root {
    --bg: #05080f;
    --accent: #00e5cc;
    --dim: #4a8a82;
    --border: #1f3d3a;
    --panel-head: #0a1210;
    --surface: #0a0f14;
    --err: #ff6b6b;
    --warn: #ffd93d;
    --ok: #00e5cc;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    min-height: 100vh;
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
    color: var(--accent);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lain {
    width: 100%;
    min-height: 100vh;
    background: var(--bg);
    border-left: 1px solid var(--accent);
    border-right: 1px solid var(--accent);
    display: flex;
    flex-direction: column;
  }

  /* STATUS BAR */
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px; border-bottom: 1px solid var(--accent);
    font-size: 11px; letter-spacing: 0.08em;
  }
  .status-bar .left { display: flex; gap: 20px; align-items: center; }
  .status-bar .right { display: flex; gap: 16px; align-items: center; }
  .sep { color: var(--dim); }
  .dim { color: var(--dim); }
  .accent { color: var(--accent); }
  .conn-ok { color: var(--ok); }
  .conn-err { color: var(--err); }
  .conn-pend { color: var(--dim); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* QUERY SECTION */
  .query-section {
    padding: 16px 20px;
    border-bottom: 1px solid var(--accent);
    display: flex;
    gap: 12px;
    align-items: center;
    background: var(--surface);
  }
  .query-section .label {
    color: var(--dim); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; flex-shrink: 0;
  }
  .preset-select {
    border: 1px solid var(--border); background: var(--bg);
    color: var(--accent); font-family: inherit; font-size: 11px;
    padding: 8px 12px; border-radius: 3px; cursor: pointer; min-width: 200px;
  }
  .preset-select:focus { border-color: var(--accent); outline: none; }
  .preset-select option { background: var(--bg); color: var(--accent); }
  .query-input {
    flex: 1; border: 1px solid var(--border); background: var(--bg);
    color: var(--accent); font-family: inherit; font-size: 12px;
    padding: 10px 14px; outline: none; border-radius: 3px;
  }
  .query-input:focus { border-color: var(--accent); }
  .query-input::placeholder { color: var(--dim); }
  .exec-btn {
    background: var(--accent); color: var(--bg); border: none;
    padding: 10px 24px; font-family: inherit; font-size: 11px;
    letter-spacing: 0.1em; cursor: pointer; border-radius: 3px;
    font-weight: bold;
  }
  .exec-btn:hover { opacity: 0.85; }

  /* CONSOLE */
  .console-panel {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
  }
  .console-head {
    padding: 8px 20px; border-bottom: 1px solid var(--border);
    font-size: 10px; letter-spacing: 0.1em; color: var(--dim);
    background: var(--panel-head); display: flex; justify-content: space-between; align-items: center;
  }
  .console-body {
    flex: 1; overflow-y: auto; padding: 16px 20px; font-size: 11px;
  }
  .log-entry {
    margin-bottom: 12px; padding-bottom: 12px;
    border-bottom: 1px solid rgba(31,61,58,0.4);
    display: flex; flex-direction: column; gap: 6px;
  }
  .log-entry .row { display: flex; gap: 12px; align-items: baseline; }
  .log-entry .ts { color: var(--dim); font-size: 10px; min-width: 70px; flex-shrink: 0; }
  .log-entry .dir { font-weight: bold; min-width: 16px; flex-shrink: 0; }
  .log-entry .tool-name { color: var(--accent); font-size: 11px; min-width: 100px; flex-shrink: 0; }
  .log-entry .detail { color: #7ab5aa; font-size: 10px; }
  .log-entry .ok { color: var(--ok); }
  .log-entry .err { color: var(--err); }
  .log-entry pre {
    background: var(--bg); border: 1px solid var(--border);
    padding: 12px; margin-top: 8px; white-space: pre-wrap;
    font-size: 11px; max-height: 300px; overflow-y: auto;
    color: #7ab5aa; border-radius: 3px;
  }
  .log-entry .response-block {
    background: var(--bg); border: 1px solid var(--border);
    padding: 12px; margin-top: 8px; white-space: pre-wrap;
    font-size: 11px; max-height: 400px; overflow-y: auto; color: var(--dim);
    border-radius: 3px;
  }
  .log-entry .response-block.error { border-color: var(--err); color: var(--err); }
  .splash {
    color: var(--dim); font-size: 11px; line-height: 1.6;
    text-align: center; padding: 40px 20px;
  }

  /* SCROLLBARS */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); }

  /* RIBBON */
  .ribbon {
    border-top: 1px solid var(--border); padding: 6px 20px;
    display: flex; justify-content: space-between; font-size: 9px;
    color: var(--dim); letter-spacing: 0.1em;
  }
  .ribbon .accent { color: var(--accent); }
</style>
</head>
<body>

<div class="lain">

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="left">
      <span>▓▓ L·A·I·N ▓▓</span>
      <span class="sep">|</span>
      <span>MCP: <span id="conn-status" class="conn-pend">PENDING</span></span>
      <span class="sep">|</span>
      <span>TOOLS: <span id="tools-count" class="accent">--</span></span>
      <span class="sep">|</span>
      <span>GRAPH: <span id="graph-nodes" class="accent">--</span> nodes · <span id="graph-edges" class="accent">--</span> edges</span>
    </div>
    <div class="right">
      <span class="dim">v<span id="pkg-version" class="accent">--</span></span>
      <span class="sep">|</span>
      <span id="clock" class="accent">--:--:--</span>
    </div>
  </div>

  <!-- QUERY SECTION -->
  <div class="query-section">
    <span class="label">QUERY</span>
    <select id="preset-queries" class="preset-select">
      <option value="">─ preset queries ─</option>
      <option value='{"ops": [{"op": "find", "type": "Function"}]}'>Find all Functions</option>
      <option value='{"ops": [{"op": "find", "type": "Class"}]}'>Find all Classes</option>
      <option value='{"ops": [{"op": "find", "type": "File"}]}'>Find all Files</option>
      <option value='{"ops": [{"op": "find", "type": "Function"}, {"op": "limit", "count": 20}, {"op": "sort", "field": "name", "direction": "asc"}]}'>Top 20 Functions (A-Z)</option>
      <option value='{"ops": [{"op": "find", "type": "Method"}]}'>Find all Methods</option>
      <option value='{"ops": [{"op": "find", "type": "Module"}]}'>Find all Modules</option>
      <option value='{"ops": [{"op": "find", "type": "Interface"}]}'>Find all Interfaces</option>
      <option value='{"ops": [{"op": "find", "type": "Function"}, {"op": "connect", "edge": "Calls", "direction": "incoming"}]}'>Functions with Callers</option>
      <option value='{"ops": [{"op": "find", "type": "Function"}, {"op": "connect", "edge": "Calls", "direction": "outgoing"}]}'>Functions with Callees</option>
      <option value='{"ops": [{"op": "find", "type": "Class"}, {"op": "connect", "edge": "Inherits", "direction": "incoming"}]}'>Classes with Inheritance</option>
      <option value='{"ops": [{"op": "find", "type": "Function"}, {"op": "filter", "name": "*test*"}]}'>Test Functions</option>
      <option value='{"ops": [{"op": "find", "type": "Variable"}]}'>Find all Variables</option>
      <option value='{"ops": [{"op": "find", "type": "Constant"}]}'>Find all Constants</option>
    </select>
    <input type="text" id="query-input" class="query-input" placeholder='{"ops": [{"op": "find", "type": "Function"}]}'>
    <button class="exec-btn" id="query-btn">EXEC</button>
  </div>

  <!-- CONSOLE -->
  <div class="console-panel">
    <div class="console-head">
      <span>══ OUTPUT ════════════════════════════════════════════</span>
      <span>[<a href="javascript:clearLog()" style="color:var(--dim);text-decoration:none">clear</a>]</span>
    </div>
    <div class="console-body" id="console-body">
      <pre class="splash" id="splash-text">LAIN · Query Console
v<span id="splash-version">--</span>

transport: http/json-rpc
status: <span id="console-status" class="conn-pend">connecting...</span></pre>
      <div id="log-entries"></div>
    </div>
  </div>

  <!-- RIBBON -->
  <div class="ribbon">
    <span>mode: <span class="accent">diagnostic</span></span>
    <span>transport: <span class="accent">http · json-rpc</span></span>
    <span>local · EN</span>
  </div>
</div>

<script>
const BASE = window.location.origin;
let toolsCountEl = document.getElementById('tools-count');
let graphNodesEl = document.getElementById('graph-nodes');
let graphEdgesEl = document.getElementById('graph-edges');
let connStatusEl = document.getElementById('conn-status');
let consoleStatusEl = document.getElementById('console-status');
let logEntriesEl = document.getElementById('log-entries');
let splashVersionEl = document.getElementById('splash-version');
let pkgVersionEl = document.getElementById('pkg-version');

// Clock
function tick() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
tick();
setInterval(tick, 1000);

// MCP request helper
async function mcpRequest(method, params = null) {
  const request = { jsonrpc: '2.0', method, params, id: Date.now() };
  const resp = await fetch(`${BASE}/mcp`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(request)
  });
  return resp.json();
}

// Add log entry
function addLog(dir, tool, detail, className = '', responseText = null) {
  const ts = new Date();
  const tsStr = `${String(ts.getHours()).padStart(2,'0')}:${String(ts.getMinutes()).padStart(2,'0')}:${String(ts.getSeconds()).padStart(2,'0')}`;

  const entry = document.createElement('div');
  entry.className = 'log-entry';

  const row = document.createElement('div');
  row.className = 'row';
  if (dir) row.innerHTML += `<span class="dir" style="color:${className === 'err' ? 'var(--err)' : className === 'ok' ? 'var(--ok)' : 'var(--accent)'}">${dir}</span>`;
  if (tool) row.innerHTML += `<span class="tool-name">${tool}</span>`;
  if (detail) row.innerHTML += `<span class="${className || 'detail'}">${detail}</span>`;
  entry.appendChild(row);

  if (responseText) {
    const respDiv = document.createElement('pre');
    respDiv.className = 'response-block' + (className === 'err' ? ' error' : '');
    respDiv.textContent = responseText.slice(0, 2000) + (responseText.length > 2000 ? '\n...(truncated)' : '');
    entry.appendChild(respDiv);
  }

  logEntriesEl.appendChild(entry);
  logEntriesEl.scrollTop = logEntriesEl.scrollHeight;
}

// Clear log
function clearLog() {
  logEntriesEl.innerHTML = '';
}

// Load health and status
async function loadStatus() {
  try {
    const health = await fetch(`${BASE}/health`).then(r => r.json());
    graphNodesEl.textContent = health.graph_nodes?.toLocaleString() || '--';
    graphEdgesEl.textContent = health.graph_edges?.toLocaleString() || '--';
    toolsCountEl.textContent = health.tools_count || '--';
    if (health.version) {
      splashVersionEl.textContent = health.version;
      pkgVersionEl.textContent = health.version;
    }
  } catch (e) { /* health optional */ }
}

// Check MCP connection
async function checkMcp() {
  try {
    const res = await mcpRequest('tools/list');
    if (res.result && res.result.tools) {
      connStatusEl.textContent = 'OK';
      connStatusEl.className = 'conn-ok';
      consoleStatusEl.textContent = 'connected';
      consoleStatusEl.className = 'conn-ok';
      return true;
    }
  } catch (e) { /* not connected */ }
  connStatusEl.textContent = 'ERR';
  connStatusEl.className = 'conn-err';
  consoleStatusEl.textContent = 'disconnected';
  consoleStatusEl.className = 'conn-err';
  return false;
}

// Execute query
async function executeQuery() {
  const input = document.getElementById('query-input');
  const val = input.value.trim();
  if (!val) return;

  let query;
  try { query = JSON.parse(val); }
  catch { addLog('◂', 'err', 'Invalid JSON query', 'err'); return; }

  addLog('▸', 'query_graph', JSON.stringify(query).slice(0, 80), 'detail');
  try {
    const res = await mcpRequest('tools/call', { name: 'query_graph', arguments: { query } });
    if (res.result && res.result.content) {
      addLog('◂', 'ok', 'query_graph', 'ok', res.result.content[0]?.text);
    } else if (res.error) {
      addLog('◂', 'err', res.error.message, 'err');
    }
  } catch (e) {
    addLog('◂', 'err', e.message, 'err');
  }
}

// Preset dropdown
document.getElementById('preset-queries').addEventListener('change', e => {
  if (e.target.value) {
    document.getElementById('query-input').value = e.target.value;
  }
});

// Query input Enter key
document.getElementById('query-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    executeQuery();
  }
});

// Exec button
document.getElementById('query-btn').addEventListener('click', executeQuery);

// Init
async function init() {
  await loadStatus();
  await checkMcp();
}
init();
</script>

</body>
</html>
