# codecov.yml — LAIN coverage configuration.
#
# Coverage regressions fail CI: `target: auto` compares against the base
# commit and `threshold: 1%` tolerates noise up to one percentage point.
# The CI upload step sets `fail_ci_if_error: true`
# (.github/workflows/ci.yml job `coverage`) so a broken upload is visible
# instead of silently leaving the badge dark.
#
# Coverage runs on the main line (push/PR-to-main) only — the fast lane
# deliberately skips the llvm-cov build to keep PR turnaround short; see
# the comment on the `coverage` job in ci.yml.
#
# To raise the floor later: read the current % from codecov.io and switch
# `target: auto` to a fixed value (e.g. target: 70%).
codecov:
  require_ci_to_pass: true
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error

# Skip the noisy-comment forest by default. Anything not listed here
# is uploaded but not surfaced as a separate status.
comment:
  layout: 'header, diff, flags, components, files, footer'
  behavior: default
