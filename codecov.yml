# codecov.yml — LAIN coverage configuration.
#
# Coverage target is intentionally zero until a deliberate baseline PR
# is opened. The CI upload step also sets `fail_ci_if_error: false`
# (.github/workflows/ci.yml job `coverage`) so that any upload-time
# problem (network, missing token, drift in the action) does not
# block merges while the baseline is being established.
#
# To set a real baseline:
#   1. Land one PR with these settings unchanged.
#   2. Read the resulting coverage % from the codecov.io dashboard.
#   3. Open a follow-up PR that tightens `target` and `threshold` to
#      something defensible (e.g., target: 70%, threshold: 1%).
#   4. Only then add the Codecov badge to README.md.
codecov:
  require_ci_to_pass: false
  status:
    project:
      default:
        target: 0%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 0%
        threshold: 0%
        if_ci_failed: error

# Skip the noisy-comment forest by default. Anything not listed here
# is uploaded but not surfaced as a separate status.
comment:
  layout: 'header, diff, flags, components, files, footer'
  behavior: default
