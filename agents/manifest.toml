version = 1

[[agent]]
id = "claude"
display_name = "Claude Code"
binary = "claude"
detect_paths = ["~/.claude"]
config_user = "~/.claude/settings.json"
config_project = ".claude/settings.json"
config_format = "json"
mcp_section = "mcpServers"
mcp_name = "lain"
transport = "http"
command = "/home/sebastian/.local/lain/lain"
default_args = ["--workspace", "{{workspace}}", "--transport", "stdio", "--embedding-model", "/home/sebastian/.local/lain/models/all-MiniLM-L6-v2.onnx"]
headless_probe = ["claude", "--print", "--mcp-config", "{{config_path}}", "list your tools"]
format = "http"

[[agent]]
id = "kimi"
display_name = "Kimi Code"
binary = "kimi"
detect_paths = ["~/.kimi-code/plugins/managed/lain"]
config_user = "~/.kimi-code/plugins/managed/lain/kimi.plugin.json"
config_project = ".kimi-code/plugins/lain/kimi.plugin.json"
config_format = "kimi-plugin"
mcp_section = "mcpServers"
mcp_name = "lain"
transport = "http"
command = "/home/sebastian/.local/lain/lain"
default_args = ["--workspace", "{{workspace}}", "--transport", "stdio", "--embedding-model", "/home/sebastian/.local/lain/models/all-MiniLM-L6-v2.onnx"]
headless_probe = ["kimi", "-p", "list your tools"]
format = "http"

[[agent]]
id = "cursor"
display_name = "Cursor"
binary = "cursor"
detect_paths = ["~/.cursor"]
config_user = "~/.cursor/mcp.json"
config_project = ".cursor/mcp.json"
config_format = "json"
mcp_section = "mcpServers"
mcp_name = "lain"
transport = "http"
command = "/home/sebastian/.local/lain/lain"
default_args = ["--workspace", "{{workspace}}", "--transport", "stdio", "--embedding-model", "/home/sebastian/.local/lain/models/all-MiniLM-L6-v2.onnx"]
headless_probe = []
format = "http"

[[agent]]
id = "continue"
display_name = "Continue.dev"
binary = "continue-cli"
detect_paths = ["~/.continue"]
config_user = "~/.continue/config.json"
config_project = ".continue/config.json"
config_format = "continue"
mcp_section = "mcpServers"
mcp_name = "lain"
transport = "http"
command = "/home/sebastian/.local/lain/lain"
default_args = ["--workspace", "{{workspace}}", "--transport", "stdio", "--embedding-model", "/home/sebastian/.local/lain/models/all-MiniLM-L6-v2.onnx"]
headless_probe = []
format = "http"

[[agent]]
id = "antigravity"
display_name = "Antigravity CLI (agy)"
binary = "agy"
detect_paths = ["~/.gemini/antigravity-cli", "~/.gemini"]
# `agy` reads MCP servers from `~/.gemini/config/mcp_config.json` (a separate
# file from `settings.json`). The adapter writes there.
config_user = "~/.gemini/config/mcp_config.json"
config_project = ".gemini/config/mcp_config.json"
config_format = "gemini-mcp-config"
mcp_section = "mcpServers"
mcp_name = "lain"
transport = "http"
command = "/home/sebastian/.local/lain/lain"
default_args = ["--workspace", "{{workspace}}", "--transport", "stdio", "--embedding-model", "/home/sebastian/.local/lain/models/all-MiniLM-L6-v2.onnx"]
headless_probe = ["agy", "--print", "list your MCP tools"]
format = "http"

[[agent]]
id = "cline"
display_name = "Cline"
binary = "cline"
detect_paths = ["~/.cline"]
config_user = "~/.cline/mcp.json"
config_project = ".cline/mcp.json"
config_format = "json"
mcp_section = "mcpServers"
mcp_name = "lain"
transport = "http"
command = "/home/sebastian/.local/lain/lain"
default_args = ["--workspace", "{{workspace}}", "--transport", "stdio", "--embedding-model", "/home/sebastian/.local/lain/models/all-MiniLM-L6-v2.onnx"]
headless_probe = []
format = "http"

