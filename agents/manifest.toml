headless_probe = ["omp", "--headless"]
format = "http"

[[agent]]
# Windsurf ships only as a full IDE; no headless CLI. The install loop can still
# write this config and `lain agents verify` will mark it `not installed`
# until a Windsurf IDE on this host creates the file. The Windsurf row is
# kept so the manifest stays a single source of truth and a future Windsurf
# CLI does not require a manifest change.
id = "windsurf"
display_name = "Windsurf (no headless CLI)"
binary = "windsurf"
detect_paths = ["~/.windsurf"]
config_user = "~/.windsurf/mcp.json"
config_project = ".windsurf/mcp.json"
config_format = "json"
mcp_section = "mcpServers"
mcp_name = "lain"
transport = "http"
command = "/home/sebastian/.local/lain/lain"
default_args = ["--workspace", "{{workspace}}", "--transport", "stdio", "--embedding-model", "/home/sebastian/.local/lain/models/all-MiniLM-L6-v2.onnx"]
headless_probe = []
format = "http"

[[agent]]
id = "vscode_copilot"
display_name = "VS Code + GitHub Copilot"
binary = "code"
detect_paths = [".vscode"]
config_user = ""
config_project = ".vscode/mcp.json"
config_format = "json"
mcp_section = "servers"
mcp_name = "lain"
transport = "http"
command = "/home/sebastian/.local/lain/lain"
default_args = ["--workspace", "{{workspace}}", "--transport", "stdio", "--embedding-model", "/home/sebastian/.local/lain/models/all-MiniLM-L6-v2.onnx"]
headless_probe = []
format = "http"