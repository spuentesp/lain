headless_probe = ["codex", "--quiet"]
format = "http"

[[agent]]
id = "omp"
display_name = "OMP"
binary = "omp"
detect_paths = ["~/.omp"]
config_user = "~/.omp/mcp.json"
config_project = ".omp/mcp.json"
config_format = "json"
mcp_section = "mcpServers"
mcp_name = "lain"
